    shadowText('房内金币 ' + B.coins, VIEW_W / 2 - 70, 82, 16, '#ffd23f');
    /* 能力图标：激活亮、未激活灰；无敌带剩余秒数 */
    const bf = B.buffs;
    const chips = [
      { t: '2J',  on: bf.doubleJump },
      { t: bf.invincible > 0 ? '★' + Math.ceil(bf.invincible) : '★', on: bf.invincible > 0 },
      { t: '»»',  on: bf.speedBoost },
      { t: 'F',   on: bf.fireball },
    ];
    let cx = VIEW_W / 2 - 96;
    ctx.textAlign = 'center';                           // 能力图标与商店价格同用居中排版
    /* 入口横管常驻提示：主动退出规则要看得见，而不是藏在源码里 */
    if (B.state === 'shop') shadowText('站管口按住 S 键退出（余额折半）', 112 - camX, 12 * TILE, 11, '#9fb4d0');
    for (const c of chips) {
      rect(ctx, cx, 90, 44, 16, c.on ? 'rgba(255,210,63,.22)' : 'rgba(10,10,26,.5)');
      shadowText(c.t, cx + 22, 103, 13, c.on ? '#ffd23f' : '#54607a');
      cx += 50;
    }
    /* 商店砖上方 2 格：品名 + 价格（买不起=红，已购=灰，可续购=倒计时） */
    for (const it of BR_SHOP) {
      const sx = it.col * TILE + TILE / 2 - camX;
      if (sx < -40 || sx > VIEW_W + 40) continue;
      const s = B.shop[it.col], used = map[BR_SHOP_ROW] && map[BR_SHOP_ROW][it.col] === T_QUSED;
      const poor = !used && B.coins < it.price;
      const blink = s && s.flashT > 0 && Math.floor(s.flashT * 10) % 2 === 0;
      const nameCol = used ? '#7e93ba' : (poor || blink ? '#ff5a5a' : '#ffffff');
      shadowText(it.name, sx, (BR_SHOP_ROW - 2) * TILE + 22, 12, nameCol);
      if (used) {
        if (it.repeat && s && s.respawnT > 0) shadowText('恢复 ' + Math.ceil(s.respawnT) + 's', sx, (BR_SHOP_ROW - 1) * TILE + 20, 12, '#9fb4d0');
        else shadowText('已购', sx, (BR_SHOP_ROW - 1) * TILE + 20, 12, '#7e93ba');
      } else {
        const ds = String(it.price).length;
        drawPixNum(it.price, 0, sx - (ds - 1) * 4 - 3, (BR_SHOP_ROW - 1) * TILE + 8, 2, poor || blink ? '#ff5a5a' : '#ffe066');
      }
    }
    /* Boss 血条：越过竞技场分界列才显示（与“激活”同一判据，避免提前剧透） */
    const pcol = Math.floor((player.x + player.w / 2) / TILE);
    if (B.boss && B.state === 'boss' && pcol >= BR_ARENA_COL) {
      const b = B.boss, x0 = VIEW_W - 150, y0 = 76, cell = 24;
      shadowText('BOSS', x0 - 44, y0 + 12, 14, '#ff9de2');
      for (let i = 0; i < b.maxHp; i++) {
        const alive = i < b.hp;
        const flash = alive && b.hurtT > 0 && Math.floor(b.hurtT * 24) % 2 === 0;
        rect(ctx, x0 + i * cell, y0, cell - 4, 12, alive ? (flash ? '#ffffff' : '#e63946') : '#3a3a52');
        if (alive) rect(ctx, x0 + i * cell, y0, cell - 4, 3, flash ? '#ffe0e0' : '#ff8a92');
      }
    }
    ctx.textAlign = 'left';
  }
  /* 提示文字：出房后仍短暂可见（承载“50% 返还”等结算口径） */
  if (B.msgT > 0 && B.msg) {
    ctx.textAlign = 'center';
    shadowText(B.msg, VIEW_W / 2, 150, 22, '#ffd23f');
    ctx.textAlign = 'left';
  }
}

/** 标题 → 开局：一次性入口，防连点重复触发 */
function startGame() {
  if (gameState !== 'title') return;
  if (levelLocked(titleSel)) { sfx('bump'); return; }   // 未解锁关不允许启动
  resetGame();
}

let lastPauseT = 0;                                   // 暂停防连点节流（触屏双击误触）
function togglePause() {
  const now = performance.now();
  if (now - lastPauseT < 200) return;
  lastPauseT = now;
  if (gameState === 'play') gameState = 'pause';
  else if (gameState === 'pause') gameState = 'play';
}

/* ---- 倒计时紧迫梯度：剩余越少心跳越急（lub-dub 双跳），让"时间"成为可感知的压力 ---- */
let heartT = 0;
function updateTimePressure(dt) {
  const left = TIME_LIMIT - gameTime;
  if (!audioOn || !actx || bossRoom.active || left <= 0 || left > 60) { heartT = 0; return; }
  const interval = left <= 5 ? 0.22 : left <= 10 ? 0.34 : left <= 30 ? 0.55 : 1.0;   // 四档：60/30/10/5 秒逐级加速
  heartT += dt;
  if (heartT >= interval) {
    heartT -= interval;
    kickHit(0.05, 0);                                // 低频主跳
    tone(58, 46, 0.07, 'sine', 0.028, 0.05);         // 次级回跳（lub-dub）
  }
}

function update(dt) {
  coinT += dt;
  if (bossRoom.msgT > 0) bossRoom.msgT = Math.max(0, bossRoom.msgT - dt);   // 房内提示：出房后仍要自行倒计时消失
  /* ---- 倒计时归零的统一死亡判定（上提到顶层）----
   * 覆盖 play / 入管 / 出管 三种"时间照常走"的状态，杜绝"滑管途中跨过 0 点却等到回 play 才结算"的漏判。
   * 直接进 dying，不依赖 die() 的 play 守卫（入管态下 die() 会拒绝）。 */
  if (gameTime >= TIME_LIMIT && (gameState === 'play' || gameState === 'pipeIn' || gameState === 'pipeOut')) {
    gameState = 'dying'; deathT = 0; player.vy = -760; player.vx = 0; sfx('death');
    return;
  }
  if (gameState === 'play') {
    gameTime += dt;
    updateTimePressure(dt);                          // 倒计时紧迫梯度（心跳渐急；视觉分档见 drawHUD）
    if (morphT > 0) {                                 // 变身定格：全场暂停，仅角色新旧形态闪烁
      morphT -= dt;
    } else {
      updatePlayer(dt);
      updateLifts(dt);
      liftRide(dt);
      collectCoins();
      spawnEnemiesIfNeeded();
      for (const e of enemies) updateEnemy(e, dt);
      enemyBounce();
      shellHitsEnemies();
      playerEnemyHits();
      for (const it of items) updateItem(it, dt);
      itemCollect();
      if (world === 'over') { updatePlants(dt); plantHits(); }
      updateFireballs(dt);
      if (bossRoom.active) updateBossRoom(dt);         // 资源管理 Boss 房：房内状态机 / Boss 战 / 掉落金币
      if (challengeRoom.active) updateChallenge(dt);   // 机关挑战房：倒计时递减 / 超时反锁金库
      tryEnterPipe();
      checkExitPipeTrigger();
      checkFlag();
    }
  } else if (gameState === 'pipeIn') {
    updatePipeIn(dt);
  } else if (gameState === 'pipeOut') {
    updatePipeOut(dt);
  } else if (gameState === 'dying') {
    updateDying(dt);
  } else if (gameState === 'pole') {
    updatePole(dt);
  } else if (gameState === 'tohouse') {
    updateToHouse(dt);
  } else if (gameState === 'flagup') {
    updateFlagUp(dt);
  } else if (gameState === 'tally') {
    updateTally(dt);
  }
  /* 敌人出屏/死亡回收 */
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.gone || e.squashT > 0.6 || (e.dead && e.y > MAP_H * TILE + 120) ||
        e.x + e.w < camX - 140) enemies.splice(i, 1);
  }
  /* 特效推进 */
  for (let i = effects.length - 1; i >= 0; i--) {
    const e = effects[i];
    e.t += dt; e.y += e.vy * dt;
    if (e.vx) e.x += e.vx * dt;
    if (e.type === 'coin' || e.type === 'frag' || e.type === 'cap') e.vy += 1500 * dt;
    else if (e.type === 'firework') e.vy += FIREWORK_GRAV * dt;
    if (e.t > e.life) FX_POOL.push(effects.splice(i, 1)[0]);
  }
  for (const [k, b] of bumps) { b.t += dt; if (b.t > BUMP_T) bumps.delete(k); }
  updateCamera(dt);
}

/* ================== 7. 音效（WebAudio 振荡器 8-bit 占位，无音频文件） ================== */
let audioOn = true, actx = null, masterGain = null;
try { audioOn = localStorage.getItem('pmario_mute') !== '1'; } catch (e) {}
function ensureAudio() {
  if (!actx) {
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = actx.createGain();                 // 主音量总线（M 总开关）
      masterGain.gain.value = audioOn ? 1 : 0;
      masterGain.connect(actx.destination);
      makeNoise();                                    // 白噪缓冲随上下文一次性生成（鼓组共用）
      initAudioFx();                                 // 脉冲占空比波形 + 回声总线（上下文重建时同步重建）
    } catch (e) { actx = null; }
  }
  if (actx && actx.state === 'suspended') actx.resume();
}
/** 单音：f0→f1 滑音，dur 秒，指数衰减 */
function tone(f0, f1, dur, type, vol, when) {
  if (!masterGain) return;
  const t0 = actx.currentTime + (when || 0);
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t0);
  if (f1 !== f0) o.frequency.linearRampToValueAtTime(f1, t0 + dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(masterGain);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
/* ---- NES 脉冲波（占空比）+ APU 回声总线：让干巴巴的方波有"FC 肉感" ---- */
const PULSE_WAVE = { w12: null, w25: null };      // 12.5% / 25% 占空比波形（50% 即原生 square，无需生成）
let echoSend = null;                               // 回声总线输入端（干信号由此送入产生尾音）
function initAudioFx() {
  if (!actx || PULSE_WAVE.w12) return;            // 波形终身复用（占空比不随上下文重建而变）
  function pw(duty) {                              // duty=高电平占比；cos 级数近似，相位中心对齐，音色等同
    const N = 40, real = new Float32Array(N), imag = new Float32Array(N);
    real[0] = duty;
    for (let n = 1; n < N; n++) real[n] = Math.sin(2 * Math.PI * n * duty) / (Math.PI * n);
    return actx.createPeriodicWave(real, imag);
  }
  PULSE_WAVE.w12 = pw(0.125);
  PULSE_WAVE.w25 = pw(0.25);
  /* 回声：delay 0.09s → 低通 2400 衰减高频 → 反馈 0.3 成尾音，湿信号直出主总线 */
  echoSend = actx.createGain();
  const delay = actx.createDelay(0.5); delay.delayTime.value = 0.09;
  const fb = actx.createGain(); fb.gain.value = 0.3;
  const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;
  echoSend.connect(delay); delay.connect(lp); lp.connect(fb); fb.connect(delay);   // 反馈回路
  delay.connect(masterGain);                       // 湿信号直出（音量由 echoSend 输入量控制）
}
/** 占空比脉冲音：duty='12'|'25'（其余回退方形波）；echo=true 时干信号同时送入回声总线 */
function pulse(f0, f1, dur, duty, vol, when, echo) {
  if (!masterGain) return;
  const t0 = actx.currentTime + (when || 0);
  const o = actx.createOscillator(), g = actx.createGain();
  const wv = duty === '12' ? PULSE_WAVE.w12 : (duty === '25' ? PULSE_WAVE.w25 : null);
  if (wv) o.setPeriodicWave(wv); else o.type = 'square';
  o.frequency.setValueAtTime(f0, t0);
  if (f1 !== f0) o.frequency.linearRampToValueAtTime(f1, t0 + dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(masterGain);             // 干信号
  if (echo && echoSend) o.connect(echoSend);       // 送入回声总线（尾音）
  o.start(t0); o.stop(t0 + dur + 0.02);
}
/* ---- 噪声打击乐通道：8-bit 味道的 hi-hat / snare（白噪 + 滤波 + 极短包络） ---- */
let NOISE_BUF = null;
function makeNoise() {
  if (!actx || NOISE_BUF) return;
  const n = Math.max(1, Math.floor(actx.sampleRate * 0.3));
  NOISE_BUF = actx.createBuffer(1, n, actx.sampleRate);
  const d = NOISE_BUF.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
}
/** dur 秒 / cutoff Hz / type 滤波类型 / vol 峰值：任一非法即静音返回（AudioParam 遇 NaN 会整条链路抛错） */
function noiseHit(dur, cutoff, vol, when, type) {
  if (!masterGain || !NOISE_BUF) return;
  const d = +dur, f = +cutoff, v = +vol;
  if (!(isFinite(d) && isFinite(f) && isFinite(v)) || d <= 0 || v <= 0) return;
  const t0 = actx.currentTime + (when || 0);
  const s = actx.createBufferSource(), bq = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = NOISE_BUF; s.loop = true;
  bq.type = type || 'highpass'; bq.frequency.value = Math.min(20000, Math.max(40, f));
  g.gain.setValueAtTime(v, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + d);
  s.connect(bq); bq.connect(g); g.connect(masterGain);
  s.start(t0); s.stop(t0 + d + 0.02);
}
/** 底鼓：正弦快速下扫（无噪声也有的低频冲击） */
function kickHit(vol, when) { tone(150, 45, 0.09, 'sine', vol, when); }
const SFX_DEF = {
  jump:   () => pulse(260, 640, 0.16, '12', 0.13, 0),
  coin:   () => { pulse(988, 988, 0.07, '12', 0.14, 0, true); pulse(1319, 1319, 0.24, '12', 0.14, 0.07, true); },

  shrink: () => [1047, 784, 659, 523, 392].forEach((f, i) => pulse(f, f, 0.07, '25', 0.13, i * 0.05)),
  death:  () => [494, 466, 440, 415, 392, 330, 262, 196].forEach((f, i) => tone(f, f, 0.12, 'square', 0.15, i * 0.11)),
  fire:   () => pulse(880, 220, 0.12, '12', 0.12, 0, true),
  sprout: () => tone(220, 660, 0.10, 'square', 0.12, 0),
  star:   () => [1319, 1568, 1976, 2637].forEach((f, i) => pulse(f, f, 0.07, '25', 0.13, i * 0.045, true)),
  flag:   () => [392, 523, 659, 784, 880, 1047].forEach((f, i) => tone(f, f, 0.09, 'triangle', 0.12, i * 0.07)),
  win:    () => [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, f, 0.16, 'square', 0.13, i * 0.08)),
  oneup:  () => [660, 880, 1100, 1320, 1560, 1760].forEach((f, i) => tone(f, f, 0.07, 'square', 0.12, i * 0.055)),
  pop:    () => { tone(1200, 160, 0.14, 'square', 0.12, 0); tone(500, 80, 0.12, 'triangle', 0.10, 0.02); },
  skid:   () => tone(210, 90, 0.22, 'sawtooth', 0.10, 0),
  pipe:   () => tone(300, 90, 0.5, 'square', 0.14, 0),
  hurry:  () => [880, 880, 880, 880].forEach((f, i) => tone(f, f, 0.08, 'square', 0.16, i * 0.13)),
  tap:    () => tone(1500, 900, 0.03, 'square', 0.05, 0),   // 触屏落键极轻点击声（无震动设备的手感补偿）
};
function sfx(name) {
  if (!audioOn) return;
  ensureAudio();
  if (actx && SFX_DEF[name]) SFX_DEF[name]();
}
/** 跳跃音：基频随水平速度上移（原版跑跳音色区分） */
function jumpSfx(vx) {
  if (!audioOn) return;
  ensureAudio();
  if (!actx) return;
  const k = Math.min(1, vx / MAX_SPEED);
  pulse(260 + k * 120, 640 + k * 260, 0.16, '12', 0.13, 0);
}
/** 短乐句 stinger：一次性 1 秒级动机，只给“事件”用（Boss 击破/挑战失败），不进入循环 */
function stinger(name) {
  if (!audioOn) return;
  ensureAudio();
  if (!actx) return;
  if (name === 'bossWin') {                            // 大调上行琶音 + 长顶音：击破的落点感
    [60, 64, 67, 72, 76, 79].forEach((n, i) => tone(midi2f(n), midi2f(n), 0.11, 'square', 0.11, i * 0.085));
    tone(midi2f(84), midi2f(84), 0.55, 'square', 0.10, 6 * 0.085);
    tone(midi2f(48), midi2f(48), 0.6, 'triangle', 0.09, 6 * 0.085);
  } else if (name === 'bossLose') {                    // 半音下行 + 低音长音：失败的塌落感
    [64, 63, 62, 61].forEach((n, i) => tone(midi2f(n), midi2f(n), 0.16, 'triangle', 0.11, i * 0.14));
    tone(midi2f(49), midi2f(45), 0.55, 'triangle', 0.10, 4 * 0.14);
  }
}

let bgmIdx = 0, bgmNext = 0, bgmTrack = '';
function bgmTick() {
  const playing = gameState === 'play' || gameState === 'pipeIn' || gameState === 'pipeOut';
  if (!actx || !masterGain || !audioOn || !playing) return;
  if (bgmNext < actx.currentTime) bgmNext = actx.currentTime + 0.06;   // 暂停恢复/掉帧后重新对拍
  /* Boss 战 BGM 优先级最高：激活战斗且未退回商店区且 Boss 存活时播放 */
  const bossFight = bossRoom.active && bossRoom.state === 'boss' && !bossRoom.atHome
                  && bossRoom.boss && bossRoom.boss.hp > 0 && bossRoom.boss.state !== 'dead';
  const under = world === 'under';
  /* 选曲：Boss 战 > 奖励房内 > 关卡自带 theme（1-2 地下 / 1-3 高空），缺省地上主题曲 */
  const trName = bossFight ? 'boss' : (under ? 'under'
                 : (cur.music || (cur.theme === 'under' ? 'under' : 'over')));
  const tr = BGM_TRACKS[trName] || BGM_TRACKS.over;
  if (trName !== bgmTrack) { bgmTrack = trName; bgmIdx = 0; }           // 换曲从头起小节，避免半句切入
  const mel = tr.mel, bas = tr.bas, kit = DRUM_KITS[tr.kit], drumVol = tr.drum;
  /* 速度：无敌星/Hurry-up 沿用原版；Boss 战整体稍快（0.92≈152BPM），阶段3狂暴再加速（0.85≈165BPM） */
  const bossRage = bossFight && bossRoom.boss && bossRoom.boss.phase >= 3;
  const spd = player.starT > 0 ? 0.55 : hurry ? 0.72 : (bossRage ? 0.85 : (bossFight ? 0.92 : 1));
  const eighth = BGM_EIGHTH * tr.rate * spd;
  /* Boss 战音量稍大，增加压迫感 */
  const melVol = bossFight ? 0.05 : (under ? 0.038 : 0.042);
  const basVol = bossFight ? 0.065 : 0.055;
  while (bgmNext < actx.currentTime + 0.4) {                            // 前瞻 0.4s 排音
    const when = bgmNext - actx.currentTime;
    const m = mel[bgmIdx % mel.length];
    if (m) pulse(midi2f(m), midi2f(m), eighth * 0.85, '12', melVol, when);   // 主旋律：12.5% 脉冲波（NES 味）
    if (bgmIdx % 2 === 0) {
      const b = bas[(bgmIdx >> 1) % bas.length];
      if (b) tone(midi2f(b), midi2f(b), eighth * 1.7, 'triangle', basVol, when);
    }
    if (kit) {                                        // 鼓组：16 个八分步一轮
      const st = bgmIdx % 16;
      if (kit.k[st] === '1') kickHit(0.07 * drumVol, when);
      if (kit.s[st] === '1') { noiseHit(0.09, 1900, 0.05 * drumVol, when, 'bandpass'); tone(190, 150, 0.05, 'triangle', 0.035 * drumVol, when); }
      if (kit.h[st] === '1') noiseHit(0.028, 7600, 0.026 * drumVol, when, 'highpass');
    }
    bgmIdx++; bgmNext += eighth;
  }
}

/** 平滑跟随 + 地图边界钳制（无视差） */
function updateCamera(dt) {
  const target = Math.max(0, Math.min(player.x + player.w / 2 - VIEW_W * 0.42,
                                       MAP_W * TILE - VIEW_W));
  camX += (target - camX) * Math.min(1, dt * 10);
  if (Math.abs(target - camX) < 0.5) camX = target;
}
/** 当前可视列区间（性能验收用：渲染只遍历该区间） */
function visibleRange() {
  return [ Math.max(0, Math.floor(camX / TILE)),
           Math.min(MAP_W - 1, Math.ceil((camX + VIEW_W) / TILE)) ];
}

function makeSprite(rows, pal) {
  const c = makeCanvas(rows[0].length * 2, rows.length * 2), g = c.getContext('2d');
  rows.forEach((r, y) => { for (let x = 0; x < r.length; x++) {
    const col = (pal || PAL)[r[x]]; if (col) rect(g, x * 2, y * 2, 2, 2, col);
  }});
  return c;
}
function mkSmall(p) {
  return {
    idle: makeSprite(SMALL_STAND, p),
    run:  [makeSprite(SMALL_WALK1, p), makeSprite(SMALL_WALK2, p), makeSprite(SMALL_WALK3, p)],
    jump: makeSprite(SMALL_JUMP, p),
    skid: makeSprite(SMALL_SKID, p),
    dead: makeSprite(DEAD_MAP, p),
    climb: makeSprite(SMALL_CLIMB, p),
  };
}
function mkBig(p) {
  return {

const PLANT_SPR  = makeSprite(PLANT_MAP, PAL_PLANT);       // 食人花（红苞白点·黑描边）

/* ---- 背景：天空渐变 + 云 + 山丘（同速跟随，无视差） ---- */
const SKY_GRADIENT = (() => {
  const lg = ctx.createLinearGradient(0, 0, 0, VIEW_H);
  lg.addColorStop(0, '#3f6fe8'); lg.addColorStop(0.65, '#5c94fc'); lg.addColorStop(1, '#9ecbff');
  return lg;
})();
const clouds = [];
for (let i = 0; i < 8; i++) clouds.push({ x: 120 + i * 420 + (i % 3) * 90, y: 48 + (i % 4) * 42 });
/* C1：背景云/山丘/灌木预渲染到离屏画布，运行时只 drawImage（与瓦片/角色同一"预渲染一切"策略，
 *      不再每帧用逐行 fillRect 现画） */
function bake(w, h, draw) { const c = makeCanvas(w, h); draw(c.getContext('2d')); return c; }
const CLOUD_SPR = bake(68, 32, g => {
  rect(g, 0, 16, 68, 16, '#ffffff'); rect(g, 12, 8, 44, 12, '#ffffff'); rect(g, 22, 0, 22, 10, '#ffffff');
});
function bakeHill(big) {
  const w = big ? 160 : 80, h = big ? 38 : 19;
  return bake(w, h, g => { for (let r = 0; r < h; r++) {
    const half = Math.round(w * (r + 1) / h / 2);
    rect(g, w / 2 - half, r, half * 2, 1, '#1ea41e');
    rect(g, w / 2 - half, r, 1, 1, '#0c5c0c'); rect(g, w / 2 + half - 1, r, 1, 1, '#0c5c0c');
  }});
}
function bakeBush(wide) {
  const n = wide ? 3 : 2, w = (n - 1) * 26 + 34;
  return bake(w, 20, g => {
    for (let i = 0; i < n; i++) {
      rect(g, i * 26, 6, 34, 14, '#22ac38');           // 团身
      rect(g, i * 26 + 8, 0, 18, 6, '#22ac38');        // 顶部凸起
    }
    for (let i = 0; i < n; i++) rect(g, i * 26, 18, 34, 2, '#0e6a24');   // 底部压暗
  });
}
const HILL_BIG = bakeHill(true), HILL_SMALL = bakeHill(false);
const BUSH_WIDE = bakeBush(true), BUSH_SMALL = bakeBush(false);
function drawCloud(x, y) { ctx.drawImage(CLOUD_SPR, x, y - 8); }
function drawHill(sx, groundY, big) { ctx.drawImage(big ? HILL_BIG : HILL_SMALL, sx, groundY - (big ? 38 : 19)); }
function drawBush(sx, groundY, wide) { ctx.drawImage(wide ? BUSH_WIDE : BUSH_SMALL, sx, groundY - 20); }
const decors = [];
for (let c = 0; c < MAP_W; c += 48) {
  decors.push({ kind: 'hill', col: c, big: true });
  decors.push({ kind: 'bush', col: c + 11, wide: false });
  decors.push({ kind: 'hill', col: c + 16, big: false });
  decors.push({ kind: 'bush', col: c + 23, wide: true });
  decors.push({ kind: 'bush', col: c + 41, wide: false });
}

/* ---- HUD 像素数字（3×5 点阵） ---- */
const PIX_GLYPHS = {
  '0': '111101101101111', '1': '010110010010111', '2': '111001111100111',
  '3': '111001111001111', '4': '101101111001001', '5': '111100111001111',
  '6': '111100111101111', '7': '111001001001001', '8': '111101111101111',
  '9': '111101111001111', 'X': '000101010101000',
};
function drawGlyph(ch, x, y, s, col) {
  const g = PIX_GLYPHS[ch]; if (!g) return;
  ctx.fillStyle = col;
  for (let i = 0; i < 15; i++)
    if (g[i] === '1') ctx.fillRect(x + (i % 3) * s, y + ((i / 3) | 0) * s, s, s);
}
function drawPixNum(n, width, x, y, s, col) {
  const str = String(Math.max(0, n | 0)).padStart(width, '0');
  for (const ch of str) { drawGlyph(ch, x, y, s, col); x += 4 * s; }
}

/* ---- 渲染主入口：瓦片只遍历可视列区间 visibleRange() ---- */
function render() {
  const dark = world === 'under' || cur.theme === 'under';   // 地下主题：黑底 + 全蓝瓦片/管道
  const TS = dark ? tileSpritesU : tileSprites, PS = dark ? PIPES_UNDER : PIPES_OVER;
  if (dark) rect(ctx, 0, 0, VIEW_W, VIEW_H, '#0c0c16');   // 地下：黑底，无天光云丘
  else {
  ctx.fillStyle = SKY_GRADIENT; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  for (const c of clouds) { const sx = c.x - camX; if (sx > -80 && sx < VIEW_W + 80) drawCloud(sx, c.y); }
  for (const d of decors) {
    const sx = Math.round(d.col * TILE - camX);
    if (sx <= -220 || sx >= VIEW_W + 220) continue;
    if (d.kind === 'hill') drawHill(sx, GROUND_ROW * TILE, d.big);
    else drawBush(sx, GROUND_ROW * TILE, d.wide);
  }
  }
  for (const it of items) drawItem(it);              // 先画道具：升起阶段被砖块遮住

  const [x0, x1] = visibleRange();
  for (let ty = 0; ty < MAP_H; ty++) for (let tx = x0; tx <= x1; tx++) {
    const t = map[ty][tx];
    if (!t) continue;
    let oy = 0;
    const b = bumps.get(tx + ',' + ty);
    if (b) oy = -Math.round(Math.sin(Math.PI * b.t / BUMP_T) * 6);   // 被顶砖弹跳偏移
    const sx = Math.round(tx * TILE - camX), sy = Math.round(ty * TILE + oy);
    if (t === T_HIDDEN) {                             // 隐藏砖：平时不可见，每约1.8s 微光闪现一下（原版的位置提示）
      const ph = coinT % 1.8;
      if (ph < 0.22) {
        ctx.globalAlpha = 0.22 + 0.35 * Math.sin(Math.PI * ph / 0.22);
        ctx.drawImage(TS[T_QBLOCK], sx, sy);
        ctx.globalAlpha = 1;
      }
      continue;
    }
    if (t === T_COIN) ctx.drawImage(coinFrames[Math.floor(coinT * 8) % 3], sx, sy);
    else if (t === T_PIPE) {                          // 管道：地上管口朝上；吊管（下方无管且上方有管）管口朝下=顶盖上下翻转
      const above = tileAt(tx, ty - 1) === T_PIPE, below = tileAt(tx, ty + 1) === T_PIPE;
      const left = tileAt(tx - 1, ty) !== T_PIPE;
      if (!below && above) {
        ctx.save(); ctx.translate(sx, sy); ctx.scale(1, -1);
        ctx.drawImage(left ? PS.TL : PS.TR, 0, -TILE);
        ctx.restore();
      } else ctx.drawImage(!above ? (left ? PS.TL : PS.TR) : (left ? PS.BL : PS.BR), sx, sy);
    }
    else if (t === T_SWITCH) {                        // 机关砖：7s 内亮绿、超时自动回橙（实时判定，与开闸同一口径）
      ctx.drawImage(crIsLit(tx + ',' + ty) ? SWITCH_ON_SPR : TS[T_SWITCH], sx, sy);
    }
    else ctx.drawImage(TS[t], sx, sy);
  }
  if (world === 'over') drawPlants();
  drawLifts();
  drawFlag();
  drawEffects();
  for (const e of enemies) drawEnemy(e);
  if (bossRoom.active) drawBossRoom();              // Boss 房：掉落金币 + 库巴（画在角色之前）
  for (const f of fireballs) drawFireball(f);
  drawPlayer();
  if (bossRoom.active) drawBossRoomFx();            // 锤子 / 火焰画在角色之上：贴脸威胁必须可读
  if (world === 'under' && !bossRoom.active) drawSidePipe();   // 横管画在角色之上：滑入即被遮住
  if (bossRoom.active) drawRoomEntryPipe();         // Boss 房入口横管（左）
  drawCastleFlag();                               // 城堡升旗（画在城堡前：塔身遮挡未升出部分）
  drawCastle();                                   // 城堡盖在角色上：走进门洞即“没入”
  drawHUD();
}

/** 食人花渲染：缩回管内不绘制；伸出时精灵底边贴在管口，管口以下裁掉（藏在管里） */
function drawPlants() {
  for (const pl of plants) {
    if (pl.exposed < 1) continue;
    const sx = Math.round(pl.cx - PLANT_SPR_W / 2 - camX);
    if (sx < -PLANT_SPR_W || sx > VIEW_W) continue;
    ctx.save();
    if (pl.down) {                                   // 吊管食人花：精灵上下翻转，管口以下可见（管内部分裁掉）
      ctx.beginPath(); ctx.rect(sx, Math.round(pl.mouthY), PLANT_SPR_W, VIEW_H - pl.mouthY); ctx.clip();
      ctx.translate(sx, Math.round(pl.mouthY)); ctx.scale(1, -1);
      ctx.drawImage(PLANT_SPR, 0, -Math.round(pl.exposed));
    } else {
      ctx.beginPath(); ctx.rect(sx, 0, PLANT_SPR_W, pl.mouthY); ctx.clip();
      ctx.drawImage(PLANT_SPR, sx, Math.round(pl.mouthY - pl.exposed));
    }
    ctx.restore();
  }
}

/** 地下出口横管（程序化像素，管口朝左，画在角色之上；原版奖励房管道为蓝色） */
function drawSidePipe() {
  const room = (cur.unders && cur.unders[roomIdx]) || { w: 30 };
  const x = Math.round((room.w - 4) * TILE - camX), y = 13 * TILE;
  const w = 3 * TILE, h = 2 * TILE;
  rect(ctx, x + 12, y + 5, w - 12, h - 10, '#0058f8');   // 管身
  rect(ctx, x + 18, y + 5, 9, h - 10, '#7ca8fc');        // 高光
  rect(ctx, x, y, 12, h, '#0058f8');                     // 竖唇（管口）
  rect(ctx, x, y, 4, h, '#7ca8fc');
  rect(ctx, x + 9, y, 3, h, '#000000');
  rect(ctx, x, y, 12, 3, '#000000'); rect(ctx, x, y + h - 3, 12, 3, '#000000');
}

/** 终点旗杆：杆身 + 杆顶球 + 三角旗（抓杆后旗子降下） */
function drawFlag() {
  const x = Math.round(GOAL_COL * TILE - camX);
  if (x < -64 || x > VIEW_W + 64) return;
  const gy = GROUND_ROW * TILE, topY = gy - 8 * TILE;
  rect(ctx, x + 4, gy - TILE, 24, TILE, '#9a6a30');                  // 杆底基座石块（原版）
  rect(ctx, x + 4, gy - TILE, 24, 3, '#5a3a10'); rect(ctx, x + 4, gy - 3, 24, 3, '#5a3a10');
  rect(ctx, x + 4, gy - TILE, 3, TILE, '#5a3a10'); rect(ctx, x + 25, gy - TILE, 3, TILE, '#5a3a10');
  rect(ctx, x + 14, topY, 4, 8 * TILE, '#dfe6ea');                   // 旗杆
  rect(ctx, x + 12, topY - 6, 8, 6, '#ffd23f');                      // 杆顶
  const fy = topY + 4 + flagProg * (7 * TILE);
  ctx.fillStyle = '#e63946';                                          // 三角旗
  for (let i = 0; i < 12; i++) ctx.fillRect(x + 18, fy + i * 2, Math.max(2, 18 - i * 1.6), 2);
}

/** 终点城堡（程序化像素）：城垛 + 中央塔 + 黑门洞 + 窗 */
/** 城堡升旗：进城堡后旗子从塔身后升起（画在城堡之前，塔身遮挡未升出部分） */
function drawCastleFlag() {
  if (castleFlagT < 0 || world !== 'over') return;
  const gy = GROUND_ROW * TILE, cx = CASTLE_COL * TILE;
  if (cx - camX < -220 || cx - camX > VIEW_W + 220) return;
  const prog = Math.min(1, castleFlagT / 1.2);
  const fy = (gy - 96) - 96 * prog;                      // 从塔身内升到塔顶上方（终点整旗露出）
  ctx.drawImage(FLAGC_SPR, cx + 80 - 13, fy, 26, 32);
}
function drawCastle() {
  const x = Math.round(CASTLE_COL * TILE - camX), gy = GROUND_ROW * TILE;
  if (x < -260 || x > VIEW_W + 260) return;
  const B = '#b5482a', D = '#3d1408', L = '#e08060';
  const W = 5 * TILE, H = 4 * TILE, by = gy - H;
  rect(ctx, x, by, W, H, B);                                            // 主堡体
  for (let r = 1; r < 8; r++) { ctx.fillStyle = D; ctx.fillRect(x, by + r * 16, W, 1); }  // 砖缝
  for (let i = 0; i < 5; i++) rect(ctx, x + i * TILE + 6, by - 12, 20, 12, B);           // 城垛
  const tw = 2 * TILE, tx0 = x + (W - tw) / 2;
  rect(ctx, tx0, by - 12 - TILE, tw, TILE, B);                          // 中央塔
  rect(ctx, tx0 + 4, by - 12 - TILE - 10, 14, 10, B); rect(ctx, tx0 + tw - 18, by - 12 - TILE - 10, 14, 10, B);
  rect(ctx, x, by, W, 2, L); rect(ctx, tx0, by - 12 - TILE, tw, 2, L);  // 高光
  rect(ctx, x + W / 2 - 17, gy - 48, 34, 48, D);                        // 门洞拱框
  rect(ctx, x + W / 2 - 13, gy - 44, 26, 44, '#181818');                // 门洞
  rect(ctx, x + 18, by + 20, 14, 14, D); rect(ctx, x + W - 32, by + 20, 14, 14, D);      // 窗
}

function drawEffects() {
  for (const e of effects) {
    if (e.type === 'banner') {                        // 首次拾取教学横幅：屏幕中上方固定，淡入淡出，不随镜头滚动
      const a = Math.min(1, e.t / 0.2, (e.life - e.t) / 0.4);
      ctx.globalAlpha = Math.max(0, a);
      ctx.textAlign = 'center';
      ctx.font = 'bold 20px monospace';
      ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillText(e.txt, VIEW_W / 2 + 1, e.y + 1);
      ctx.fillStyle = e.col || '#ffe066'; ctx.fillText(e.txt, VIEW_W / 2, e.y);
      ctx.textAlign = 'left'; ctx.globalAlpha = 1;
      continue;
    }
    const sx = Math.round(e.x - camX), sy = Math.round(e.y);
    if (e.type === 'coin') ctx.drawImage(coinFrames[Math.floor(coinT * 10) % 3], sx, sy);
    else if (e.type === 'frag') {
      rect(ctx, sx, sy, 7, 7, '#b5482a'); rect(ctx, sx + 1, sy + 1, 3, 3, '#e08060');
    } else if (e.type === 'cap') {
      ctx.drawImage(CAP_SPR, sx, sy);
    } else if (e.type === 'dust') {                     // 打滑扬尘
      ctx.globalAlpha = Math.max(0, 1 - e.t / e.life);
      rect(ctx, sx, sy, 4, 4, '#e8e8e8');
      ctx.globalAlpha = 1;
    } else if (e.type === 'firework') {
      ctx.globalAlpha = Math.max(0, 1 - e.t / e.life);
      rect(ctx, sx - 2, sy - 2, 4, 4, e.col || '#ffd23f');
      ctx.globalAlpha = 1;
    } else {
      ctx.font = 'bold 14px monospace'; ctx.fillStyle = '#3d1408'; ctx.fillText(e.txt, sx + 1, sy + 1);
      ctx.fillStyle = e.col || '#ffe066'; ctx.fillText(e.txt, sx, sy);
    }
  }
}

function drawItem(it) {
  if (it.gone) return;
  const sx = Math.round(it.x - camX), sy = Math.round(it.y);
  let spr;
  if (it.kind === 'star') spr = STAR_SPRS[Math.floor(coinT * 8) % 4];         // 原版四色循环闪
  else if (it.kind === 'flower') spr = FLW_SPRS[Math.floor(coinT * 8) % 4];   // 火之花原版调色轮转
  else if (it.kind === 'oneup') spr = ONEUP_SPR;
  else if (it.kind === 'coinshroom') spr = COINSHROOM_SPR;
  else if (it.kind === 'poison') spr = POISON_SPR;
  else spr = MUSH_SPR;
  ctx.drawImage(spr, sx + Math.round((it.w - spr.width) / 2), sy + it.h - spr.height);   // 底部对齐居中
}

/** 升降台渲染：像素石板台面（描边+高光+面缝），与整体画风一致 */
function drawLifts() {
  for (const L of lifts) {
    const sx = Math.round(L.x - camX), sy = Math.round(L.y);
    if (sx < -128 || sx > VIEW_W + 128) continue;
    ctx.fillStyle = '#303830'; ctx.fillRect(sx, sy, L.w, L.h);
    ctx.fillStyle = '#b0c0a8'; ctx.fillRect(sx + 2, sy + 2, L.w - 4, L.h - 4);
    ctx.fillStyle = '#e0ead8';
    for (let k = 0; k < 3; k++) ctx.fillRect(sx + 6 + k * 32, sy + 2, 22, 4);
    ctx.fillStyle = '#809078';
    for (let k = 0; k < 4; k++) ctx.fillRect(sx + 8 + k * 24, sy + 9, 14, 3);
  }
}

function drawEnemy(e) {
  const sx = Math.round(e.x - camX), sy = Math.round(e.y);
  if (sx < -64 || sx > VIEW_W + 64) return;
  let spr, dx, dy, mirror = false;
  if (e.kind === 'goomba') {
    if (e.squashT > 0) {                                                // 压扁：整帧压成贴地扁片
      ctx.drawImage(EG_SPR, sx - 4, sy + e.h - 10, 32, 10);
      return;
    }
    spr = EG_SPR; dx = sx - 4; dy = sy + e.h - spr.height;
    mirror = Math.floor(e.runT) % 2 === 1;                              // 走路两帧=左右镜像（原版）
  } else if (e.kind === 'koopa' || e.kind === 'para') {
    const setR = e.red;
    spr = Math.abs(e.vx) > 15 ? (setR ? KOOPA_RUN_R : KOOPA_RUN)[Math.floor(e.runT) % 2] : (setR ? EK_SPR_R : EK_SPR);
    dx = sx - 4; dy = sy + e.h - spr.height;
    mirror = e.vx < 0;                                                  // 素材朝右：向左行走进镜像
  } else {
    spr = e.red ? ES_SPR_R : ES_SPR; dx = sx - 4; dy = sy + e.h - spr.height;              // 龟壳
  }
  ctx.save();
  if (e.dead) {                                                         // 击飞：绕精灵中心倒转
    const cx = dx + spr.width / 2, cy = dy + spr.height / 2;
    ctx.translate(cx, cy); ctx.scale(1, -1); ctx.translate(-cx, -cy);
  } else if (mirror) {
    ctx.translate(dx + spr.width, dy); ctx.scale(-1, 1);
    dx = 0; dy = 0;
  }
  ctx.drawImage(spr, dx, dy);
  ctx.restore();
  if (e.kind === 'para' && !e.dead) {                                   // 跳跳龟背翅：双翼两帧扑扇
    const flap = Math.floor(gameTime * 8) % 2;
    const wx = sx + 3, wy = sy - (flap ? 7 : 3);
    ctx.fillStyle = '#fcfcfc';
    ctx.fillRect(wx, wy, 9, 4);
    ctx.fillRect(wx + 12, wy - (flap ? 2 : 0), 9, 4);
    ctx.fillStyle = '#c8c8c8';
    ctx.fillRect(wx + 2, wy + 4, 17, 2);
  }
}

function drawFireball(f) {
  const sx = Math.round(f.x - camX), sy = Math.round(f.y);
  ctx.drawImage(FIRE_SPRS[Math.floor(f.t * 16) % 4], sx - 3, sy - 3);   // 原版火焰 16px 帧轮转，居中于碰撞盒
}

function drawPlayer() {
  const p = player;
  if (gameState === 'play' && morphT <= 0 && p.invulnT > 0 && Math.floor(p.invulnT * 16) % 2 === 0) return;  // 受击无敌闪烁（变身定格期间不隐藏，见 morphT 分支）
  let set;                                               // 无敌星：红绿槽三循环（原版换色闪）；Boss 房买的「无敌」复用同一套视觉
  const invT = p.starT > 0 ? p.starT : (bossRoom.active ? bossRoom.buffs.invincible : 0);
  if (invT > 0) {
    const cyc = p.mode === 'small' ? SP_STAR : p.mode === 'fire' ? SPF_STAR : SPB_STAR;
    set = cyc[Math.floor(invT * 10) % 3];
    if (invT < 3 && Math.floor(invT * 8) % 2 === 0)                   // 结束前3秒：普通/星色急促交替 = 到时预警
      set = p.mode === 'small' ? SP : p.mode === 'fire' ? SPF : SPB;
  } else set = p.mode === 'small' ? SP : p.mode === 'fire' ? SPF : SPB;
  const skidding = p.onGround && ((input.left && p.vx > 20) || (input.right && p.vx < -20));
  let spr = gameState === 'pole' ? set.climb
          : !p.onGround ? set.jump
          : p.crouch ? set.crouch
          : skidding ? set.skid                                  // 原版急转身帧
          : Math.abs(p.vx) > 15 ? set.run[Math.floor(p.runT) % 3] : set.idle;
  if (morphT > 0) {                                    // 变身定格：新旧形态交替闪烁
    const fromSet = morphFrom === 'small' ? SP : (morphFrom === 'fire' ? SPF : SPB);
    spr = Math.floor(morphT * 12) % 2 === 0 ? fromSet.idle : set.idle;
  }
  ctx.save();
  if (gameState === 'dying') {                                        // 死亡动画：正面举手帧，上跃坠落（原版）
    ctx.translate(Math.round(p.x - camX) + p.w / 2, Math.round(p.y) + p.h / 2);
    ctx.drawImage(set.dead, -set.dead.width / 2, -set.dead.height / 2);
    ctx.restore(); return;
  }
  const dx = Math.round((p.w - spr.width) / 2), dy = p.h - spr.height;   // 底部对齐+水平居中（镜像安全）
  /* 大形态精灵比碰撞盒高出 ~12px：探进实心砖的部分源裁剪（头顶被砖遮住，脚不离地） */
  let cropTop = 0;
  const over = spr.height - p.h;
  if (over > 0) {
    const sprTop = p.y - over;
    const c0 = Math.floor((p.x + 3) / TILE), c1 = Math.floor((p.x + p.w - 3) / TILE);
    for (let r = Math.max(0, Math.floor(sprTop / TILE)); r * TILE < p.y; r++)
      for (let c = c0; c <= c1; c++)
        if (isSolid(c, r)) cropTop = Math.max(cropTop, Math.min(over, (r + 1) * TILE - sprTop));
  }
  ctx.translate(Math.round(p.x - camX) + (p.facing < 0 ? p.w : 0), Math.round(p.y));
  if (p.facing < 0) ctx.scale(-1, 1);
  if (gameState === 'pipeIn') ctx.globalAlpha = Math.max(0, 1 - seqT / 0.65);   // 入管渐隐
  if (cropTop > 0) ctx.drawImage(spr, 0, cropTop, spr.width, spr.height - cropTop,
                                 dx, dy + cropTop, spr.width, spr.height - cropTop);
  else ctx.drawImage(spr, dx, dy);
  ctx.globalAlpha = 1;
  ctx.restore();
}

  ctx.fillStyle = col || '#ffffff';  ctx.fillText(t, x, y);
}

/* ========================= 10. 主循环（固定时间步） ========================= */
let showFps = false, fpsS = 60;

let last = performance.now(), acc = 0;
let lowT = 0, lowPerf = false;                       // 低端机单向降采样状态
function frame(now) {
  requestAnimationFrame(frame);
  let ft = (now - last) / 1000;
  last = now;
  if (ft > 0.25) ft = 0.25;                            // 切后台回来防“时间爆炸”
  if (ft > 0) fpsS += (1 / ft - fpsS) * 0.06;          // FPS 指数平滑
  if (!lowPerf) {                                      // 持续 <42fps 超 2 秒 → 内部分辨率降至 75%
    lowT = fpsS < 42 ? lowT + ft : 0;
    if (lowT > 2) {
      lowPerf = true;
      cvs.width = 720; cvs.height = 408;
      ctx.setTransform(0.75, 0, 0, 0.75, 0, 0);
      ctx.imageSmoothingEnabled = false;
    }
  }
  acc += ft;
  let n = 0;
  while (acc >= STEP && n < 8) {                       // 固定步长推进物理（标题/暂停/顿帧冻结）
    if (hitStopT > 0) hitStopT -= STEP;                // 打击顿帧：世界微冻结，画面不糊
    else if (gameState !== 'pause' && gameState !== 'title') update(STEP);
    else coinT += STEP;                                // 标题下金币动画照常闪烁
    acc -= STEP; n++;
  }
  if (n === 8) acc = 0;                                // 追帧上限，防螺旋恶化
  render();                                            // 渲染每帧一次
  bgmTick();                                           // BGM 排音（用户手势解锁 AudioContext 后自动起播）
  if (manualBtnEl) manualBtnEl.style.display = (!manualOpen && (gameState === 'title' || gameState === 'pause' || gameState === 'gameover' || gameState === 'win')) ? 'block' : 'none';
}
respawn();
applyLayoutMode();                                   // 同步定档：触屏首帧即为横屏（真横屏或 CSS 旋转），不等 rAF
addEventListener('visibilitychange', () => { if (!document.hidden) applyLayoutMode(); });   // 手机地址栏收起/回前台常只改尺寸不发 resize
requestAnimationFrame(frame);

let manualOpen = false, manualPage = 0, manualPrevState = '';
const manualBtnEl = document.getElementById('manualBtn');
const manualOverlayEl = document.getElementById('manual-overlay');
function openManual() {
  manualPrevState = gameState;
  if (gameState === 'play') gameState = 'pause';   // 冻结物理（frame 主循环跳过 pause 态 update）
  manualPage = 0; manualOpen = true;
  if (manualOverlayEl) { renderManual(); manualOverlayEl.style.display = 'flex'; }
}
function closeManual() {
  manualOpen = false;
  if (manualOverlayEl) manualOverlayEl.style.display = 'none';
  if (manualPrevState === 'play' && gameState === 'pause') gameState = 'play';   // 从 play 暂停进来的 → 恢复
  manualPrevState = '';
}
function manualGo(d) {
  manualPage = Math.max(0, Math.min(MANUAL_PAGES.length - 1, manualPage + d));
  renderManual();
}
function renderManual() {
  const p = MANUAL_PAGES[manualPage];
  const body = document.getElementById('manual-body');
  const pager = document.getElementById('manual-pager');
  if (body) body.innerHTML = p.h;
  if (pager) pager.textContent = (manualPage + 1) + ' / ' + MANUAL_PAGES.length;
  const prev = document.getElementById('manual-prev'), next = document.getElementById('manual-next');
  if (prev) prev.style.visibility = manualPage === 0 ? 'hidden' : 'visible';
  if (next) next.style.visibility = manualPage === MANUAL_PAGES.length - 1 ? 'hidden' : 'visible';
}
(function bindManual() {
  const bind = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener('pointerdown', e => { e.preventDefault(); fn(); }); };
  bind('manualBtn', openManual);
  bind('manual-close', closeManual);
  bind('manual-prev', () => manualGo(-1));
  bind('manual-next', () => manualGo(1));
  if (manualOverlayEl) manualOverlayEl.addEventListener('pointerdown', e => { if (e.target === manualOverlayEl) closeManual(); });   // 点遮罩空白关闭
})();
</script>
</body>
