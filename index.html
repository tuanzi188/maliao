    bumpTile(tx, row); sfx('grow');
    if (crLitCount() >= CR_SWITCHES.length) openGate();   // 三座同时亮 → 开闸
    else { C.msg = '同时亮 ' + crLitCount() + ' / 3'; C.msgT = 1; }
  } else { bumpTile(tx, row); sfx('bump'); }
}
function openGate() {
  const C = challengeRoom;
  C.gateOpen = true;
  for (let y = 0; y < MAP_H; y++) if (map[y][CR_GATE_COL] === T_GATE) map[y][CR_GATE_COL] = T_EMPTY;   // 闸门整列拆掉
  if (C.time >= CR_SPEED_BONUS_T) {                  // 速通奖励：开门时剩余 ≥20s
    score += CR_SPEED_BONUS;
    fxPush({ type: 'text', x: CR_GATE_COL * TILE, y: 10 * TILE, vy: -70, t: 0, life: 1.4,
             txt: 'PERFECT +' + CR_SPEED_BONUS, col: '#ffd23f' });
    C.msg = '金库开启！速通 +' + CR_SPEED_BONUS;
  } else C.msg = '金库开启！快抢金币！';
  C.msgT = 2.5;
  spawnFromBlock('1up', CR_GATE_COL + 4, 13);        // 专属奖励：金库深处 1UP 绿蘑菇
  sfx('star');
}
function updateChallenge(dt) {
  const C = challengeRoom;
  if (C.msgT > 0) C.msgT = Math.max(0, C.msgT - dt);
  if (!C.active || C.gateOpen) return;
  C.time -= dt;
  /* 渐进式提示：机关熄灭的瞬间（lit 数下降）才给一次方向提示，最多两级，不剧透答案、不刷屏 */
  const lit = crLitCount();
  if (lit < C.prevLit && C.time > 0) {
    if (C.hinted === 0) { C.msg = '提示：先顶最远的机关，折返路上再顶近的'; C.msgT = 3; C.hinted = 1; sfx('bump'); }
    else if (C.hinted === 1) { C.msg = '提示：快熄灭时再顶一次可以续亮'; C.msgT = 3; C.hinted = 2; }
  }
  C.prevLit = lit;
  if (C.time <= 0) { C.time = 0; C.failed = true; C.switches = {}; C.msg = '时间到！金库反锁（出房后重来）'; C.msgT = 2.5; sfx('bump'); }
}

/* ---- 资源管理 Boss 房：布局常量（放在本节 = 顶层 loadLevel() 调用前必须完成求值，避免 TDZ） ---- */
const BR_W            = 40;    // 房间列宽（40×32=1280px，摄像机横向滚动）
const BR_SHOP_ROW     = 11;    // 商店砖所在行
const BR_ARENA_COL    = 25;    // 竞技场起始列：玩家中心越过此列即激活 Boss
const BR_EXIT_ARM_COL = 4;     // 入口区列上限：站在此范围内按 ↓ 主动退出
const BR_INIT_COINS   = 100;   // 入房发放的房内资金（独立于全局金币）
/* 商品表：col 必须与 buildBossRoomMap 里的 T_SHOP 列一致；repeat=true → 购后砖块定时恢复可购 */
const BR_SHOP = [
  { col: 6,  key: 'doubleJump', name: '二段跳', price: 50,  tag: '2J',   desc: '空中可再跳一次', repeat: false },
  { col: 9,  key: 'invincible', name: '无敌',   price: 100, tag: 'INV',  desc: '8 秒受击不扣血', repeat: true  },
  { col: 12, key: 'speedBoost', name: '加速跑', price: 30,  tag: 'SPD',  desc: '移动速度 ×1.3',  repeat: false },
  { col: 15, key: 'fireball',   name: '火球术', price: 80,  tag: 'FIRE', desc: '小形态也能扔火球', repeat: false },
];
/** Boss 房地图：砖天花板 + 地面 + 左右墙 + 商店砖 + 过渡区平台(带金币) + 竞技场高台 */
function buildBossRoomMap() {
  const W = BR_W, R = W - 1;
  const m = Array.from({ length: MAP_H }, () => new Array(W).fill(T_EMPTY));
  for (let x = 0; x < W; x++) { m[0][x] = T_BRICK; m[1][x] = T_BRICK; m[15][x] = T_GROUND; m[16][x] = T_GROUND; }
  for (let y = 0; y < 15; y++) { m[y][0] = T_GROUND; m[y][R] = T_GROUND; }        // 左右墙
  for (const it of BR_SHOP) m[BR_SHOP_ROW][it.col] = T_SHOP;                       // 商店区：列 6/9/12/15
  for (const [a, b, r] of [[17, 19, 12], [20, 22, 10], [23, 24, 8]]) {            // 过渡区三级错落平台
    for (let x = a; x <= b; x++) { m[r][x] = T_BRICK; m[r - 1][x] = T_COIN; }      // 平台上各放一枚金币
  }
  for (const [a, b, r] of [[28, 30, 11], [34, 36, 9]])                             // 竞技场两座高台（跳上台躲避）
    for (let x = a; x <= b; x++) m[r][x] = T_BRICK;
  return m;
}

/** 查询瓦片 ID；越界返回 -1 */
function tileAt(x, y) {
  if (x < 0 || x >= MAP_W || y < 0 || y >= MAP_H) return -1;
  return map[y][x];
}
/** 实心判定：左右越界视为墙（地图边缘不穿墙）；顶部/底部开放（可跳出上沿、掉坑触发死亡） */
function isSolid(x, y) {
  if (y >= MAP_H) return false;
  if (x < 0 || x >= MAP_W) return true;
  if (y < 0) return false;
  return SOLID_TILES.has(map[y][x]);
}

/* ============================== 3. 输入 ============================== */
/* 按键状态对象：按下/松开均记录；jumpQueued 为预输入缓冲计时 */
const input = { left: false, right: false, jump: false, down: false, run: false, jumpQueued: 0, jumpSrc: 'key' };
const KEYMAP = {
  ArrowLeft: 'left',  KeyA: 'left',
  ArrowRight: 'right', KeyD: 'right',
  ArrowDown: 'down',  KeyS: 'down',
  Space: 'jump', ArrowUp: 'jump', KeyW: 'jump',
  ShiftLeft: 'run',  ShiftRight: 'run',
};
addEventListener('keydown', e => {
  ensureAudio();                                   // 首次按键手势内解锁 AudioContext
  if (e.code === 'KeyH') { e.preventDefault(); manualOpen ? closeManual() : openManual(); return; }
  if (manualOpen) {                                // 说明打开时：只接翻页/关闭，屏蔽一切游戏键
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') { e.preventDefault(); manualGo(-1); }
    else if (e.code === 'ArrowRight' || e.code === 'KeyD') { e.preventDefault(); manualGo(1); }
    else if (e.code === 'Escape' || e.code === 'Enter' || e.code === 'Space') { e.preventDefault(); closeManual(); }
    return;
  }
  if (gameState === 'title' && isTouchDevice()) return;   // 触屏开局由 pointerdown 负责，别用首指的合成 keydown 抢跳选关
  if (gameState === 'title') {                     // 标题：↑↓/W S 选关（自动跳过未解锁），其余键开始
    if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'ArrowDown' || e.code === 'KeyS') {
      const dir = (e.code === 'ArrowUp' || e.code === 'KeyW') ? -1 : 1;
      let n = titleSel;
      for (let k = 0; k < LEVELS.length; k++) {
        n = (n + dir + LEVELS.length) % LEVELS.length;
        if (!levelLocked(n)) break;
      }
      if (n !== titleSel) { titleSel = n; sfx('coin'); }
      return;
    }
    if (!levelLocked(titleSel)) startGame(); else sfx('bump');
    return;
  }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if (e.code === 'KeyR') { if (gameState === 'win') gameState = 'title'; else resetGame(); return; }
  if (e.code === 'F3')   { showFps = !showFps; e.preventDefault(); return; }
  if (e.code === 'KeyM') {                         // 音效总开关 + 持久化
    audioOn = !audioOn;
    if (masterGain) masterGain.gain.value = audioOn ? 1 : 0;
    try { localStorage.setItem('pmario_mute', audioOn ? '0' : '1'); } catch (_) {}
    return;
  }
  if (gameState !== 'play') return;                // 结算/暂停态不响应操作键
  if (e.code === 'KeyJ' || e.code === 'KeyX') { if (!e.repeat) shootFireball(); return; }
  const k = KEYMAP[e.code];
  if (!k) return;
  e.preventDefault();                              // 防空格/方向键滚动页面
  if (k === 'jump' && !input.jump && !e.repeat) { input.jumpQueued = JUMP_BUFFER; input.jumpSrc = 'key'; }
  input[k] = true;
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) input[k] = false; });
addEventListener('blur', () => {                   // 失焦防按键卡死 + 自动暂停
  input.left = input.right = input.jump = false;
  if (gameState === 'play') togglePause();
});

/* ---- 触屏虚拟按键（Pointer 事件统一鼠标/触摸；仅触屏设备或首次触摸后显示） ---- */
const touchPanel = document.getElementById('touch');
function showTouch(){
  if (touchPanel.style.display === 'block') return;
  touchPanel.style.display = 'block';
  document.body.classList.add('coarse');            // 触发控件带预留 + 触屏文案切换
}
if (matchMedia('(pointer: coarse)').matches) showTouch();
addEventListener('touchstart', showTouch, { once: true, passive: true });
/* ---- 布局模式：触屏一律横向（强制横屏），两级实现 ----
 * ① 真横屏（设备自己转，或全屏后 orientation.lock 成功）→ body.lay-x：按键走画面侧带、不占纵向；
 * ② 物理仍竖屏（iOS 未全屏时 lock 必 reject、系统锁了旋转、键盘支架…）→ body.force-rot：CSS 把 #stage 旋转 90°，
 *    画面照样横向铺满，玩家不需要任何操作。
 * 为什么要强制：960×544 的画面在竖屏里只能按宽度受限缩到约 0.42 倍面积，是"移动端看不清/键挤成一团"的第一成因；
 * 横向后同一台手机的画布面积约 2.4×。 */
const stageEl = document.getElementById('stage');
function isTouchDevice(){ return matchMedia('(pointer: coarse)').matches; }
function isPortrait(){ return matchMedia('(orientation: portrait)').matches; }
function canCssRotate(){                          // 旋转兜底是否可用（老 WebView 判 false 时退回遮罩）
  try { return (typeof CSS === 'undefined') || !CSS.supports ? true : CSS.supports('transform', 'rotate(90deg)'); }
  catch (_) { return true; }
}
function fitStage(force){
  if (force === undefined) force = document.body.classList.contains('force-rot');
  if (!force) { cvs.style.width = cvs.style.height = ''; return; }   // 真横屏/桌面：交回原 CSS 双向约束公式
  /* 轴向互换后 100vw/100vh 与画面局部轴不再对应，改按 #stage 实际盒子算 */
  const boxW = stageEl.clientWidth || cvs.width, boxH = stageEl.clientHeight || cvs.height;
  const tipEl = document.querySelector('.tip');
  const tipH = (tipEl && tipEl.offsetHeight) || 0;
  const availH = Math.max(120, boxH - tipH - 24);                   // 24 = 画框上下边框 + 提示行间距
  const band = Math.min(150, boxW * 0.22);    /* 两侧各留按键带深度：左带最深 140（▶ 76+64），右带 90（跳 2+88）
                                                  取 150 留一点余量；再大会白丢画布面积（竖向本就吃紧） */
  const w = Math.min(boxW - band * 2, availH * (cvs.width / cvs.height), cvs.width);
  cvs.style.width = w.toFixed(1) + 'px';
  cvs.style.height = (w * cvs.height / cvs.width).toFixed(1) + 'px';
}
function applyLayoutMode(){
  const touch = isTouchDevice();
  const force = touch && isPortrait() && canCssRotate();
  document.body.classList.toggle('coarse', touch);
  document.body.classList.toggle('lay-x', touch);                   // 触屏时画面必为横向（真/强制）→ 侧带布局
  document.body.classList.toggle('force-rot', force);
  if (touch) showTouch();
  fitStage(force);
  syncRotate();
}
addEventListener('resize', applyLayoutMode);
addEventListener('orientationchange', applyLayoutMode);

/* ---- 兜底遮罩：只有连 CSS 旋转都不可用的老环境才会真的挡路；其余情况画面已经横向，遮罩自动隐藏 ---- */
const rotateEl = document.getElementById('rotate');
let rotateDismissed = false;                         // 用户跳过一次后本次会话不再打扰
function syncRotate(){
  const want = isTouchDevice() && isPortrait() && !canCssRotate() && !rotateDismissed;
  rotateEl.classList.toggle('show', want);
  if (want && gameState === 'play') togglePause();   // 中途转竖屏且无法自动横屏：先暂停再挡画面
}
/* 首帧布局不能等 rAF（无头/省电节流下可能长时间不回调，会停在竖屏控件带里），
   但此处 gameState 等 let 尚未声明（TDZ），故真正的启动调用放在第 10 节末尾。 */
document.getElementById('btnSkip').addEventListener('pointerdown', e => {
  e.preventDefault(); rotateDismissed = true; syncRotate();
});
document.getElementById('btnGo').addEventListener('pointerdown', async e => {
  e.preventDefault(); ensureAudio();
  const root = document.documentElement;
  try {                                              // 全屏（iOS 不支持元素全屏时静默跳过）
    if (root.requestFullscreen) await root.requestFullscreen({ navigationUI: 'hide' });
    else if (root.webkitRequestFullscreen) root.webkitRequestFullscreen();
  } catch (_) {}
  try {                                              // 锁定横屏：安卓 WebView/Chrome 有效，iOS 会 reject
    await screen.orientation.lock('landscape');
  } catch (_) {}
  rotateDismissed = true;
  showTouch();
  applyLayoutMode();                                 // 全屏/锁定结果未知，统一重算一次布局
});
document.addEventListener('fullscreenchange', () => { // 退出全屏时解除锁定，恢复跟随系统旋转
  if (!document.fullscreenElement) { try { screen.orientation.unlock(); } catch (_) {} }
  applyLayoutMode();
});
/* ---- 触感反馈：Vibration API（Android 有效；iOS 不实现 → canVibrate=false，自动只留视觉/音效）。
     默认开启不设开关：系统级可关闭振动，游戏内不再占一个键位 ---- */
const canVibrate = typeof navigator !== 'undefined' && typeof navigator.vibrate === 'function';
function buzz(ms) { if (canVibrate) { try { navigator.vibrate(ms); } catch (_) {} } }

/* ---- 触屏按键控制器：按住型（支持拇指在相邻键间滑移）+ 点击型（暂停/全屏/震动） ----
 * 每键附带震动强度(ms)；无自带音效的持续键补一发极轻 tap 音，让 iPhone 等无震动环境也有“落键感”。 */
const HOLD_KEYS = {
  btnL: { down: () => input.left  = true,  up: () => input.left  = false, ms: 8,  tap: true  },
  btnR: { down: () => input.right = true,  up: () => input.right = false, ms: 8,  tap: true  },
  btnD: { down: () => input.down  = true,  up: () => input.down  = false, ms: 8,  tap: true  },
  btnB: { down: () => input.run   = true,  up: () => input.run   = false, ms: 6,  tap: true  },
  btnJ: { down: () => { input.jumpSrc = 'touch'; input.jump = true; input.jumpQueued = JUMP_BUFFER; },
          up: () => input.jump = false,     ms: 14, tap: false },   // 跳有 jump 音
  btnF: { down: () => shootFireball(),      up: () => {},            ms: 14, tap: false },   // 火有 fire 音
};
const heldKeys = new Set();          // 当前被按住的键（同一键只生效一次）
const ptrKey   = new Map();          // pointerId -> id（该指针当前压着的键）
function keyOn(id) {
  const h = HOLD_KEYS[id]; if (!h || heldKeys.has(id)) return;
  heldKeys.add(id);
  const el = document.getElementById(id); if (el) el.classList.add('on');
  h.down(); buzz(h.ms); if (h.tap) sfx('tap');
}
function keyOff(id) {
  if (!heldKeys.has(id)) return;
  heldKeys.delete(id);
  const el = document.getElementById(id); if (el) el.classList.remove('on');
  const h = HOLD_KEYS[id]; if (h) h.up();
}
function holdIdAt(x, y) {
  const el = document.elementFromPoint(x, y);
  return (el && el.classList && el.classList.contains('tbtn') && HOLD_KEYS[el.id]) ? el.id : null;
}
touchPanel.addEventListener('pointerdown', e => {
  const id = e.target && e.target.id;
  if (!HOLD_KEYS[id]) return;                        // 点击型按键交给各自的监听器
  e.preventDefault(); ensureAudio();
  if (gameState === 'title') { startGame(); return; }
  ptrKey.set(e.pointerId, id); keyOn(id);
});
addEventListener('pointermove', e => {               // 滑移：按住的手指滑到另一枚按住键 → 换键（滑到空处保持，符合实体键语义）
  const cur = ptrKey.get(e.pointerId);
  if (cur === undefined) return;
  const hit = holdIdAt(e.clientX, e.clientY);
  if (!hit || hit === cur) return;
  ptrKey.set(e.pointerId, hit); keyOff(cur); keyOn(hit);
}, { passive: true });
function ptrRelease(e) {
  const cur = ptrKey.get(e.pointerId);
  if (cur === undefined) return;
  ptrKey.delete(e.pointerId); keyOff(cur);
}
addEventListener('pointerup', ptrRelease);
addEventListener('pointercancel', ptrRelease);
addEventListener('blur', () => { for (const id of [...heldKeys]) keyOff(id); ptrKey.clear(); });
document.getElementById('btnP').addEventListener('pointerdown', e => {
  e.preventDefault(); ensureAudio();
  if (gameState === 'title') startGame();
  else if (gameState === 'win') gameState = 'title';                     // 通关画面：回标题（可重选关卡）
  else if (gameState === 'gameover') resetGame();
  else togglePause();
});
/* 全屏切换（隐藏移动端地址栏换取更大画面；不支持的环境直接隐藏按钮） */
(function bindFullscreen(){
  const el = document.getElementById('btnX');
  const root = document.documentElement;
  const canFs = !!(root.requestFullscreen || root.webkitRequestFullscreen);
  if (!canFs) { el.style.display = 'none'; return; }
  el.addEventListener('pointerdown', e => {
    e.preventDefault(); ensureAudio();
    const fs = document.fullscreenElement || document.webkitFullscreenElement;
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    const req  = root.requestFullscreen || root.webkitRequestFullscreen;
    if (fs) { try { exit.call(document); } catch (err) {} }
    else { try { req.call(root); } catch (err) {} }
  });
})();

/* ========================= 4. 物理与 AABB 碰撞 ========================= */
const player = { x: 0, y: 0, w: PLAYER_W, h: PLAYER_H, vx: 0, vy: 0,
                 onGround: false, wasGround: false, facing: 1,
                 cutDone: true, coyote: 0, runT: 0, stuckT: 0, jumpGrace: 0,
                 mode: 'small', invulnT: 0, starT: 0,
                 crouch: false, skidSfx: false };             // mode: small | big | fire
const SPAWN = { x: 2 * TILE, y: GROUND_ROW * TILE - PLAYER_H };
let respawnCount = 0;
let checkpoint = { x: SPAWN.x, y: SPAWN.y };        // 重生点：向右推进到的最近安全地面

function respawn() {
  player.x = SPAWN.x; player.y = SPAWN.y;
  player.vx = 0; player.vy = 0; player.cutDone = true; player.coyote = 0; player.stuckT = 0;
  respawnCount++;
}
/** 死亡后重生：回到重生点（checkpoint），形态重置为小 */
function respawnToCheckpoint() {
  if (world !== 'over') {                              // 地下死亡 → 切回地上重生点
    world = 'over'; map = overMap; MAP_W = cur.w;
    enemies.length = 0; items.length = 0; fireballs.length = 0;
  }
  player.x = checkpoint.x; player.y = checkpoint.y;
  player.vx = 0; player.vy = 0; player.cutDone = true; player.coyote = 0; player.stuckT = 0;
  player.mode = 'small'; player.w = PLAYER_W; player.h = PLAYER_H; player.starT = 0;
  player.invulnT = INVULN_T;                          // 复活无敌帧：防重生点贴脸敌人秒杀
  respawnCount++;
  /* 全局倒计时：死亡不重置，从死亡时刻继续走；归零后的死亡直接 Game Over（见 updateDying） */
  /* 清场：把徘徊在重生点周围的敌人掀飞（不计分），杜绝“复活→被撞→再死”死循环 */
  const zone = { x: player.x - 2 * TILE, y: player.y - TILE, w: player.w + 4 * TILE, h: player.h + 2 * TILE };
  for (const e of enemies) {
    if (e.dead || e.squashT > 0) continue;
    if (aabb(zone, e)) { e.dead = true; e.vy = -300; e.vx = (Math.sign(e.x - player.x) || 1) * 140; }
  }
}

/** 卡死自动复位：从当前列向两侧找“地表可站立”的列放回去（不惩罚，纯引擎健壮性） */
function respawnSafe() {
  const c0 = Math.max(1, Math.min(MAP_W - 2, Math.floor((player.x + player.w / 2) / TILE)));
  for (let r = 1; r < 80; r++) {
    for (const c of [c0 + r, c0 - r]) {
      if (c < 1 || c >= MAP_W - 1) continue;
      if (isSolid(c, GROUND_ROW) && !isSolid(c, GROUND_ROW - 2) && !isSolid(c, GROUND_ROW - 1)) {
        player.x = c * TILE + 4; player.y = GROUND_ROW * TILE - player.h;
        player.vx = 0; player.vy = 0; player.cutDone = true;
        return;
      }
    }
  }
  respawn();
}

/* ---- 形态状态机：小(1×1) ⇄ 大(1×2) ⇄ 火力(1×2)；切换给无敌帧 ---- */
function setMode(m) {
  const bottom = player.y + player.h;
  if (m !== player.mode) { morphFrom = player.mode; morphT = 0.6; }    // 变身定格：全场暂停 + 形态闪烁
  player.mode = m;
  player.w = BIG_W; player.h = BIG_H;
  player.y = bottom - player.h;
  player.invulnT = INVULN_T;                        // 变身短暂无敌帧（渲染闪烁）
}
function shrinkToSmall() {
  const bottom = player.y + player.h;
  morphFrom = player.mode; morphT = 0.6;             // 受击缩小同样定格闪烁
  player.mode = 'small'; player.crouch = false;
  player.w = PLAYER_W; player.h = PLAYER_H;
  player.y = bottom - player.h;
  player.invulnT = INVULN_T;
  fxPush({ type: 'cap', x: player.x + 4, y: player.y - 4, vx: -70, vy: -420, t: 0, life: 0.8 });   // 帽子飞走（原版受击细节）
  sfx('shrink');
}
/** 受击判定：火力/大 → 小；小 → 死亡。无敌帧内免疫 */
function hurtPlayer() {
  if (gameState !== 'play' || player.invulnT > 0) return;
  if (bossRoom.active && bossRoom.buffs.invincible > 0) return;   // 房内商品「无敌」：受击不扣血（不杀 Boss，防御不替代输出）
  comboStreak = 0;                                     // 被撞 → 连踩链清零
  buzz(50);                                            // 受击重震（触屏事件反馈）
  if (player.mode === 'small') die();
  else shrinkToSmall();
}

/** 起身头顶空间检查：站起后大形态占据的顶行无实心瓦片才允许起身 */
function crouchHeadroomFree(p) {
  const L = Math.floor(p.x / TILE), R = Math.floor((p.x + p.w - 0.01) / TILE);
  const topRow = Math.floor((p.y + p.h - BIG_H) / TILE);
  for (let tx = L; tx <= R; tx++) if (isSolid(tx, topRow)) return false;
  return true;
}

function updatePlayer(dt) {
  const p = player;
  p.invulnT = Math.max(0, p.invulnT - dt);
  p.starT = Math.max(0, p.starT - dt);
  // 倒计时归零的死亡判定已上提到 update() 顶层（涵盖滑管动画态），此处不再单独判

  /* ---- Hurry-up：剩余时间 ≤100 → 警示音 + BGM 加速（原版） ---- */
  if (!hurry && TIME_LIMIT - gameTime <= 100) { hurry = true; sfx('hurry'); }

  /* ---- 下蹲（大/火力）：1 格高，地面不可移动；起跳保持小碰撞盒 ---- */
  if (p.mode !== 'small') {
    if (!p.crouch && input.down && p.onGround) {
      const bottom = p.y + p.h;
      p.crouch = true; p.h = 32; p.y = bottom - 32;
    } else if (p.crouch && !input.down && p.onGround && crouchHeadroomFree(p)) {
      const bottom = p.y + p.h;
      p.crouch = false; p.h = BIG_H; p.y = bottom - BIG_H;
    }
  } else p.crouch = false;

  /* ---- 水平：加速度 / 反向打滑 / 摩擦 / 走跑双档限速 ----
   * 单一目标限速 cap：加速段与限速段共用同一个 cap，消除"先加速冲过 WALK_MAX 再事后回拉"的两套系统耦合。
   * 档位只看跑键（空中也一样）：之前"离地即跑档"会让走跳在空中被一路补速到 440，
   * 冲刺跳相对走跳几乎没有距离收益（实测 9.0 vs 9.9 格），而且越飞越远、落点不可控。
   * cap 只约束"还能不能再加速"，不没收已有动量 —— 空中松掉跑键不会瞬间掉速，落地摩擦再收。 */
  const wantRun = input.run;
  const spdMul = (bossRoom.active && bossRoom.buffs.speedBoost) ? BR_SPEED_MUL : 1;   // 房内商品「加速跑」：仅本房有效
  const cap = (wantRun ? RUN_MAX : WALK_MAX) * spdMul;
  const dir = (p.crouch && p.onGround) ? 0 : (input.right ? 1 : 0) - (input.left ? 1 : 0);
  if (dir !== 0) {
    const skid = p.onGround && Math.sign(p.vx) === -dir && Math.abs(p.vx) > SKID_V;   // 反向打滑
    // 同向且已达当前档位上限则不再加速（打滑中除外，打滑要能快速反抽）；只有地面才把超速硬性夹紧
    const atCap = !skid && Math.sign(p.vx) === Math.sign(dir) && Math.abs(p.vx) >= cap;
    if (atCap) {
      if (p.onGround && Math.abs(p.vx) > cap) p.vx = Math.sign(p.vx) * cap;
    } else {
      p.vx += dir * (skid ? MOVE_ACCEL * 1.7 : (p.onGround ? MOVE_ACCEL : AIR_ACCEL)) * dt;
      if (!skid && Math.sign(p.vx) === Math.sign(dir)) p.vx = Math.sign(p.vx) * Math.min(Math.abs(p.vx), cap);
    }
    p.facing = dir;
    if (skid) {                                      // 打滑：音效一次 + 扬尘
      if (!p.skidSfx) { sfx('skid'); p.skidSfx = true; }
      if (Math.random() < dt * 26)
        fxPush({ type: 'dust', x: p.x + p.w / 2 + (Math.random() * 10 - 5), y: p.y + p.h - 4,
                 vx: -dir * 40, vy: -50, t: 0, life: 0.35 });
    } else p.skidSfx = false;
  } else {
    p.skidSfx = false;
    if (p.onGround) {
      const s = Math.sign(p.vx);
      p.vx -= s * FRICTION * dt;
      if (Math.sign(p.vx) !== s) p.vx = 0;           // 摩擦不越零反向
    }
  }
  /* 跑→走动量回落：已按 RUN_MAX 冲刺后松开跑键，仍在地面同向时按 >加速率的速率收敛回 WALK_MAX */
  if (!wantRun && p.onGround && Math.abs(p.vx) > cap) {
    const over = Math.abs(p.vx) - cap;
    p.vx -= Math.sign(p.vx) * Math.min(over, 2600 * dt);
  }


  /* ---- 跳跃：土狼时间 + 预输入缓冲 + 可变高度 + 跑动加成 ---- */
  p.coyote = p.onGround ? COYOTE : p.coyote - dt;
  if (input.jumpQueued > 0) {
    input.jumpQueued -= dt;
    if (p.coyote > 0) {                             // 起跳
      p.vy = -(JUMP_V + Math.abs(p.vx) * 0.2);      // 原版：跑得越快跳得越高
      p.onGround = false;
      p.coyote = 0; p.cutDone = false; input.jumpQueued = 0;
      p.jumpGrace = input.jumpSrc === 'touch' ? JUMP_HOLD_MIN : 0;   // 触屏点按保底（见 JUMP_HOLD_MIN）
      jumpSfx(Math.abs(p.vx));                         // 音高随水平速度：跑得越快跳声越尖
    }
  }
  /* ---- Boss 房商品「二段跳」：空中再按跳 → 追加一次 85% 强度起跳（落地恢复次数） ---- */
  if (input.jumpQueued > 0 && !p.onGround && p.coyote <= 0 &&
      bossRoom.active && bossRoom.buffs.doubleJump && bossRoom.buffs.canDoubleJump) {
    p.vy = -(JUMP_V * 0.85 + Math.abs(p.vx) * 0.2);
    p.onGround = false; p.cutDone = false; input.jumpQueued = 0;
    p.jumpGrace = input.jumpSrc === 'touch' ? JUMP_HOLD_MIN : 0;
    bossRoom.buffs.canDoubleJump = false;
    jumpSfx(Math.abs(p.vx));
  }
  if (p.jumpGrace > 0) p.jumpGrace -= dt;
  /* 保底时长内即使手指已抬起，也按"仍按住"处理：触屏短点不再被当成主动要短跳。键盘 jumpSrc='key' → 恒不生效 */
  const jumpHeld = input.jump || p.jumpGrace > 0;
  if (!p.cutDone && !jumpHeld && p.vy < 0) {         // 上升中松开跳键 → 截断（短跳）
    p.vy *= JUMP_CUT; p.cutDone = true;
  }

  /* ---- 逐轴解算：先水平后垂直，各自独立回退，杜绝“卡墙角” ---- */
  p.x += p.vx * dt;
  resolveX(p);

  p.vy = Math.min(p.vy + GRAVITY * dt, MAX_FALL);
  const wasGround = p.onGround;
  p.onGround = false;
  p.y += p.vy * dt;
  resolveY(p);
  if (!wasGround && p.onGround) comboStreak = 0;      // 落地 → 连踩链清零（原版规则）
  if (p.onGround && bossRoom.active) bossRoom.buffs.canDoubleJump = true;   // 落地 → 恢复二段跳次数

  /* ---- 防卡死：身体中心嵌进实心瓦片超时 → 复位到最近安全地面 ---- */
  { const ccx = Math.floor((p.x + p.w / 2) / TILE), ccy = Math.floor((p.y + p.h / 2) / TILE);
    if (isSolid(ccx, ccy)) { p.stuckT += dt; if (p.stuckT > STUCK_T) { respawnSafe(); p.stuckT = 0; } }
    else p.stuckT = 0; }

  p.runT += Math.abs(p.vx) * dt / 16;               // 跑动动画计时

  /* ---- 重生点推进：站在实地面（非砖块悬浮台）且头顶开阔 → 记录（仅地上世界） ---- */
  if (world === 'over' && p.onGround && Math.abs(p.y + p.h - GROUND_ROW * TILE) < 1) {
    const c = Math.floor((p.x + p.w / 2) / TILE);
    if (p.x > checkpoint.x && isSolid(c - 1, GROUND_ROW) && isSolid(c + 1, GROUND_ROW) &&
        !isSolid(c, GROUND_ROW - 2) && !isSolid(c, GROUND_ROW - 3))
      checkpoint = { x: c * TILE + 4, y: GROUND_ROW * TILE - p.h };
  }

  if (p.y > MAP_H * TILE + 60) die(true);            // 摔坑 → 直接 Game Over（用户规则：不扣命不重生）
}

/** 水平轴碰撞回退：只检查运动方向一侧的列；角色宽高 < 瓦片，纵向扫过的行全部检测 */
function resolveX(e) {
  const top = Math.floor(e.y / TILE);
  const bot = Math.floor((e.y + e.h - 0.01) / TILE);
  if (e.vx > 0) {
    const col = Math.floor((e.x + e.w) / TILE);
    for (let ty = top; ty <= bot; ty++)
      if (isSolid(col, ty)) { e.x = col * TILE - e.w - 0.01; e.vx = 0; break; }
  } else if (e.vx < 0) {
    const col = Math.floor(e.x / TILE);
    for (let ty = top; ty <= bot; ty++)
      if (isSolid(col, ty)) { e.x = (col + 1) * TILE + 0.01; e.vx = 0; break; }
  }
}

/** 垂直轴碰撞回退：下落→站地面；上升→顶头被挡并触发砖块弹跳 */
function resolveY(e) {
  const L = Math.floor(e.x / TILE), R = Math.floor((e.x + e.w - 0.01) / TILE);
  if (e.vy > 0) {
    const row = Math.floor((e.y + e.h) / TILE);
    for (let tx = L; tx <= R; tx++)
      if (isSolid(tx, row)) { e.y = row * TILE - e.h; e.vy = 0; e.onGround = true; break; }
  } else if (e.vy < 0) {
    const row = Math.floor(e.y / TILE);
    let hit = false;
    for (let tx = L; tx <= R; tx++)
      if (isSolid(tx, row) || (row >= 0 && row < MAP_H && map[row][tx] === T_HIDDEN)) { hit = true; break; }
    if (hit) {
      e.y = (row + 1) * TILE; e.vy = 0;
      if (e === player) headBump(row, L, R);
      return 'ceil';
    }
  }
  return null;
}

/** 敌人爬 1 格台阶：前方是 1 格高台阶且上方两格皆空 → 整体抬升一格继续走（2 格墙仍撞回头） */
function tryStepUp(e, dir) {
  if (!e.onGround) return false;
  const col = Math.floor((dir > 0 ? e.x + e.w + 2 : e.x - 2) / TILE);   // 前方贴身探针格
  const footRow = Math.floor((e.y + e.h - 1) / TILE);                   // 脚部所在格
  if (!isSolid(col, footRow)) return false;                             // 前方不是台阶（平地/坑）
  if (isSolid(col, footRow - 1) || isSolid(col, footRow - 2)) return false;   // 2 格以上 → 撞墙
  e.y -= TILE;                                       // 瞬移抬升一格（脚下即台阶顶）
  e.x += dir * 2;                                    // 微探入台阶列，让本帧 resolveY 落到台阶顶
  return true;
}

/** 升降台推进：水平往复巡航（原版 1-3 移动台），dx 供载客随行 */
function updateLifts(dt) {
  for (const L of lifts) {
    const px = L.x;
    L.x += L.dir * L.speed * dt;
    if (L.x >= L.x0 + L.range) { L.x = L.x0 + L.range; L.dir = -1; }
    else if (L.x <= L.x0) { L.x = L.x0; L.dir = 1; }
    L.dx = L.x - px;
  }
}
/** 升降台 × 玩家：单向站面（只碰顶面，可从下方穿越）；站立随台横移，走出边缘即落 */
function liftRide(dt) {
  const p = player;
  if (p.vy < 0) p.standLift = null;                    // 起跳脱离
  if (p.standLift) {
    const L = p.standLift;
    if (p.x + p.w < L.x + 2 || p.x > L.x + L.w - 2) p.standLift = null;   // 走出台面边缘即脱离
    else { p.x += L.dx; p.y = L.y - p.h; p.vy = 0; p.onGround = true; }   // 随行 + 钉住台面（防逐帧下陷脱台）
  }
  if (!p.standLift && p.vy >= 0) {
    const feet = p.y + p.h, prevFeet = feet - p.vy * dt;
    for (const L of lifts) {
      if (p.x + p.w > L.x && p.x < L.x + L.w && prevFeet <= L.y + 4 && feet >= L.y) {
        p.y = L.y - p.h; p.vy = 0; p.onGround = true; p.standLift = L;
        break;
      }
    }
  }
}

/** 通用实体位移：重力 + 瓦片碰撞 + 撞壁自动回头（蘑菇/敌人/龟壳/火球共用） */
function moveEntity(e, dt) {
  e.x += e.vx * dt;
  const ovx = e.vx;
  resolveX(e);
  if (ovx !== 0 && e.vx === 0) {
    // 活敌（板栗仔/乌龟）撞 1 格台阶 → 爬上去继续走；壳/道具/火球及其余情况撞壁回头
    if ((e.kind === 'goomba' || e.kind === 'koopa' || e.kind === 'para') && tryStepUp(e, Math.sign(ovx))) e.vx = ovx;
    else e.vx = -ovx;
  }
  e.vy = Math.min(e.vy + GRAVITY * dt, MAX_FALL);
  e.onGround = false;
  e.y += e.vy * dt;
  resolveY(e);
}

/** 顶头：问号砖按内容出货；砖块小形态顶 N 次碎裂/大形态一顶即碎；其余实心只弹跳 */
function headBump(row, L, R) {
  const cx = Math.floor((player.x + player.w / 2) / TILE);
  const seen = new Set();                            // 去重：单列居中时 cx==L==R，防同一砖重复结算
  for (const tx of [cx, L, R]) {
    if (tx < L || tx > R || seen.has(tx)) continue;
    seen.add(tx);
    const t = map[row][tx];
    if (t === T_QBLOCK) {                            // 问号砖：弹金币或蘑菇/火之花
      map[row][tx] = T_QUSED;
      bumpTile(tx, row);
      spawnFromBlock(cur.qContents[tx + ',' + row] || 'coin', tx, row);
      brickKill(tx, row);
    } else if (t === T_HIDDEN) {                     // 隐藏砖：顶出才显形 → 变已用砖（可站立）
      map[row][tx] = T_QUSED;
      bumpTile(tx, row);
      sfx('bump');
      const hc = cur.hidden.find(h => h[0] === tx && h[1] === row);
      if (hc && hc[2] === '1up') spawnFromBlock('1up', tx, row);   // 1UP：弹出绿蘑菇
      else gainCoin(tx * TILE + 8, row * TILE - 26, false);        // 金币：直接 +200 入账（无飞行金币）
    } else if (t === T_SWITCH) {                     // 机关砖（挑战房）：顶亮
      hitSwitch(tx, row);
    } else if (t === T_BRICK || t === T_CBRICK) {    // 砖块 / 橙红砖（挑战房墙面）：等同处理
      const key = tx + ',' + row;
      if (cur.brickContents[key] === 'star' && !starBricks.has(key)) {
        // 星星砖：顶出无敌星，砖保持砖块外观且不碎（原版出物砖行为，大小形态一致）；出货后还原为普通砖
        starBricks.add(key);
        bumpTile(tx, row);
        spawnFromBlock('star', tx, row);
      } else if (cur.brickContents[key] === 'multi') {         // 十金币砖：每次顶出一枚，用尽变已用砖
        let st = multiBricks.get(key);
        if (!st) { st = { left: MULTI_COINS }; multiBricks.set(key, st); }
        gainCoin(tx * TILE, row * TILE - 26, true);
        bumpTile(tx, row);
        if (--st.left <= 0) { map[row][tx] = T_QUSED; multiBricks.delete(key); }
      } else if (player.mode !== 'small') {          // 大/火力：一顶即碎
        breakBrick(tx, row);
      } else {                                       // 小：只弹不碎（原版：小形态顶砖永不碎裂）
        bumpTile(tx, row); sfx('bump');
      }
      brickKill(tx, row);
    } else if (t === T_SHOP) {                         // Boss 房商店砖：顶起 = 购买（弹跳/音效/扣费在 buyShopItem 内）
      buyShopItem(tx, row);
    } else if (SOLID_TILES.has(t)) {                 // 地面/管道/已用砖：只弹一下
      bumpTile(tx, row);
      sfx('bump');
      brickKill(tx, row);
    }
  }
}
/** 砖块碎裂：+50 分、四散碎屑 */
function breakBrick(tx, row) {
  map[row][tx] = T_EMPTY;
  hitStopT = 0.035;
  addScore(PTS_BRICK, tx * TILE, row * TILE - 8);
  spawnBrickFragments(tx, row);
  sfx('brick');
}
/** 被顶的砖把正上方的敌人震死（+100） */
function brickKill(tx, row) {
  const x0 = tx * TILE;
  for (const e of enemies) {
    if (e.dead || e.squashT > 0) continue;
    if (Math.abs((e.y + e.h) - row * TILE) < 6 && e.x + e.w > x0 && e.x < x0 + TILE)
      killEnemy(e, e.x + e.w / 2 < player.x + player.w / 2 ? -1 : 1, PTS_STOMP);
  }
}
/** 砖块碎裂粒子 */
function spawnBrickFragments(tx, row) {
  for (let i = 0; i < 4; i++)
    fxPush({ type: 'frag',
      x: tx * TILE + 6 + (i % 2) * 12, y: row * TILE + 6 + ((i / 2) | 0) * 12,
      vx: (i % 2 ? 1 : -1) * (90 + Math.random() * 70), vy: -(300 + Math.random() * 140),
      t: 0, life: 0.5 });
}

/** 经过金币瓦片 → 拾取 +200 */
function collectCoins() {
  const p = player;
  const L = Math.floor(p.x / TILE), R = Math.floor((p.x + p.w - 0.01) / TILE);
  const Tt = Math.floor(p.y / TILE), B = Math.floor((p.y + p.h - 0.01) / TILE);
  for (let ty = Tt; ty <= B; ty++) for (let tx = L; tx <= R; tx++)
    if (tileAt(tx, ty) === T_COIN) {
      map[ty][tx] = T_EMPTY;
      /* Boss 房内所有拾币都进房内预算（独立于全局金币，出房时按规则折算） */
      if (bossRoom.active) roomCoin(tx * TILE, ty * TILE - 6);
      else gainCoin(tx * TILE, ty * TILE - 6, false);
    }
}

/* AABB 相交判定 */
function aabb(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

/* ========================== 5. 道具 / 敌人 / 火球 ========================== */
/* ---- 四色蘑菇池：power 砖 + 小形态时随机出货（每种效果固定可学习；大形态照旧出火之花，成长主线契约不变） ---- */
function rollPowerPool() {
  const r = Math.random() * 100;
  if (r < 60) return 'mushroom';      // 红：变大（主体，保证升级节奏）
  if (r < 75) return 'oneup';         // 绿：命 +1
  if (r < 90) return 'coinshroom';    // 金：+2000 分
  return 'poison';                    // 紫：大→小 / 小→-200 分
}
const MUSH_BANNER = {
  mushroom:   '超级蘑菇！可以硬抗一次伤害',
  oneup:      '1UP 蘑菇！生命 +1',
  coinshroom: '金币蘑菇！直接 +2000 分',
  poison:     '毒蘑菇！大的会缩水，小的扣 200 分',
};
const mushroomSeen = {};              // 首次拾取教学：每种蘑菇只弹一次横幅，熟手不打扰
function mushroomBanner(kind, x) {
  if (mushroomSeen[kind]) return;
  mushroomSeen[kind] = true;
  fxPush({ type: 'banner', txt: MUSH_BANNER[kind], col: '#ffe066', x, y: 150, vx: 0, vy: 0, t: 0, life: 2.4 });
}
/** 从被顶的砖里出货：金币直接弹飞计分，蘑菇/火之花生成为道具实体（缓缓升起） */
function spawnFromBlock(content, tx, row) {
  if (content === 'coin') {
    gainCoin(tx * TILE + 8, row * TILE - 26, true);
    return;
  }
  const kind = content === 'flower' ? 'flower'
             : (content === 'star' ? 'star'
             : (content === '1up' ? 'oneup'
             : (player.mode === 'small' ? rollPowerPool() : 'flower')));   // power：小形态→四色随机池，大形态→火之花
  items.push({
    kind, x: tx * TILE + 4, y: row * TILE + 6, w: 24, h: 24,
    vx: 0, vy: 0, onGround: false,
    rise: 0.7, riseTo: row * TILE - 24,
  });
  sfx('sprout');
}

/** 道具更新：升起阶段无碰撞；蘑菇落地后沿地面滑动、撞壁回头；火之花静止 */
function updateItem(it, dt) {
  if (it.rise > 0) {
    it.rise -= dt;
    it.y = Math.max(it.riseTo, it.y - 46 * dt);
    return;
  }
  if (it.kind !== 'flower') {
    if (it.vx === 0) it.vx = it.kind === 'star' ? STAR_SPEED : ITEM_SPEED;
    moveEntity(it, dt);
    if (it.kind === 'star' && it.onGround) it.vy = -STAR_BOUNCE;   // 星星：落地弹跳
  }
  if (it.y > MAP_H * TILE + 40) it.gone = true;      // 掉坑回收
}

/** 道具拾取：蘑菇 小→大；火之花 →火力（小形态吃花直接变火力） */
function itemCollect() {
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    if (it.gone) { items.splice(i, 1); continue; }
    if (it.rise > 0 || !aabb(player, it)) continue;
    if (it.kind === 'mushroom') {
      if (player.mode === 'small') { setMode('big'); sfx('grow'); }
      addScore(PTS_POWER, it.x, it.y - 8);
      mushroomBanner('mushroom', it.x);
    } else if (it.kind === 'oneup') {                 // 绿蘑菇 1UP
      lives = Math.min(99, lives + 1);
      fxPush({ type: 'text', x: it.x, y: it.y - 8, vy: -70, t: 0, life: 0.9, txt: '1UP', col: '#7ae048' });
      sfx('oneup');
      mushroomBanner('oneup', it.x);
    } else if (it.kind === 'coinshroom') {            // 金蘑菇：纯加分（不碰撞伤害，滑行同红蘑菇）
      score += 2000;
      fxPush({ type: 'text', x: it.x, y: it.y - 8, vy: -70, t: 0, life: 0.9, txt: '+2000', col: '#ffd23f' });
      sfx('oneup');
      mushroomBanner('coinshroom', it.x);
    } else if (it.kind === 'poison') {                // 毒蘑菇：大→缩回小；小→只扣分不掉命（惩罚有底线）
      if (player.mode !== 'small') shrinkToSmall();   // shrinkToSmall 自带缩小音 + 帽子飞走
      else { score = Math.max(0, score - 200);
             fxPush({ type: 'text', x: it.x, y: it.y - 8, vy: -70, t: 0, life: 0.9, txt: '-200', col: '#c8a0ff' });
             sfx('shrink'); }
      mushroomBanner('poison', it.x);
    } else if (it.kind === 'star') {                  // 无敌星：进入闪烁无敌状态
      player.starT = STAR_TIME;
      addScore(PTS_POWER, it.x, it.y - 8);
      sfx('star'); buzz(30);
    } else {
      if (player.mode !== 'fire') { setMode('fire'); sfx('grow'); buzz(30); }
      addScore(PTS_POWER, it.x, it.y - 8);
    }
    items.splice(i, 1);
  }
}

/** 敌人实体化：进入镜头视野右侧才生成 */
function spawnEnemiesIfNeeded() {
  if (world !== 'over') return;                     // 地下奖励房无敌人
  for (const s of spawns) {
    if (s.done || s.x > camX + VIEW_W + 96) continue;
    s.done = true;
    const h = (s.kind === 'koopa' || s.kind === 'para') ? 30 : 24;
    enemies.push({
      kind: s.kind, x: s.x, y: s.row * TILE - h, w: 24, h,
      vx: (s.kind === 'koopa' || s.kind === 'para') ? -KOOPA_SPEED : -GOOMBA_SPEED,
      vy: 0, onGround: false, squashT: 0, dead: false, runT: 0, red: !!s.red,
    });
  }
}

/** 敌人更新：直线行走、碰壁回头（moveEntity 内置）；被踩扁/击飞走各自轨迹 */
function updateEnemy(e, dt) {
  if (e.squashT > 0) { e.squashT += dt; return; }     // 被踩扁，等待消失
  if (e.dead) {                                       // 被壳/火球击飞：翻倒坠落
    e.vy += GRAVITY * dt;
    e.x += e.vx * dt; e.y += e.vy * dt;
    return;
  }
  if (e.kind === 'shell' && Math.abs(e.vx) < 10) {    // 龟壳复苏：静止 3.6s 后晃动，再 1.4s 复活成乌龟
    e.reviveT = (e.reviveT || 0) + dt;
    if (e.reviveT > 3.6 && e.reviveT <= 5.0) e.wobbleT = (e.wobbleT || 0) + dt;
    if (e.reviveT > 5.0) {
      const bottom = e.y + e.h;
      e.kind = 'koopa'; e.h = 30; e.y = bottom - 30; e.vx = -KOOPA_SPEED;
      e.reviveT = 0; e.wobbleT = 0; e.runT = 0;
    }
  } else if (e.kind === 'shell') { e.reviveT = 0; e.wobbleT = 0; }   // 滑行中不计时
  // 边缘折返：行走小怪（板栗仔/乌龟/跳跳龟）到坑边/平台边缘自动掉头巡逻，不掉坑（滑行龟壳除外，照飞）
  // 跳跳龟额外在空中也判边缘：单跳位移≈40px 会越过岛缘，空中折返可落回台面
  if ((e.kind === 'goomba' || e.kind === 'koopa' || e.kind === 'para') && (e.onGround || e.kind === 'para') && e.vx !== 0) {
    const ax = e.vx > 0 ? Math.floor((e.x + e.w + 2) / TILE) : Math.floor((e.x - 2) / TILE);
    if (e.onGround) e.footRow = Math.floor((e.y + e.h + 4) / TILE);    // 记住起飞行；空中沿用（顶点行会飘到空层）
    const footRow = e.footRow !== undefined ? e.footRow : Math.floor((e.y + e.h + 4) / TILE);
    if (!isSolid(ax, footRow)) e.vx = -e.vx;
  }
  if (e.kind === 'para' && e.onGround) {              // 跳跳龟：落地即弹起，沿平台循环跳跃
    e.vy = -PARA_HOP_V; e.onGround = false;
  }
  moveEntity(e, dt);
  if (Math.abs(e.vx) > 15) e.runT += e.kind === 'koopa' ? dt * Math.abs(e.vx) / 26 : dt * 6;
  if (e.y > MAP_H * TILE + 80) e.gone = true;         // 掉坑回收
}

/** 敌人互撞：相向而行碰上 → 各自折返（滑行壳除外，它直接走击飞结算） */
function enemyBounce() {
  for (let i = 0; i < enemies.length; i++) for (let j = i + 1; j < enemies.length; j++) {
    const a = enemies[i], b = enemies[j];
    if (a.dead || b.dead || a.squashT > 0 || b.squashT > 0) continue;
    if ((a.kind === 'shell' && Math.abs(a.vx) > 100) || (b.kind === 'shell' && Math.abs(b.vx) > 100)) continue;
    if (!aabb(a, b)) continue;
    const l = a.x <= b.x ? a : b, r = a.x <= b.x ? b : a;   // 左边的向左、右边的向右弹开
    if (l.vx > 0) l.vx = -Math.abs(l.vx);
    if (r.vx < 0) r.vx = Math.abs(r.vx);
  }
}

/** 滑行龟壳撞其他敌人 → 击飞 +400 */
function shellHitsEnemies() {
  for (const s of enemies) {
    if (s.kind !== 'shell' || Math.abs(s.vx) < 100 || s.dead) continue;
    for (const o of enemies) {
      if (o === s || o.dead || o.squashT > 0 || o.kind === 'shell') continue;
      if (aabb(s, o)) {
        o.dead = true; o.vy = -300; o.vx = Math.sign(s.vx) * 120;
        addScore(PTS_SHELL_KILL, o.x, o.y - 10);     // 壳撞敌固定 +400，不计入踩敌连击
        sfx('stomp'); hitStopT = 0.035;
      }
    }
  }
}

/** 敌人 × 玩家：上方踩踏 / 静止壳可踢 / 其余按状态机受伤 */
function playerEnemyHits() {
  for (const e of enemies) {
    if (e.dead || e.squashT > 0 || !aabb(player, e)) continue;
    if (player.starT > 0) {                            // 无敌星：接触即消灭，连杀走连击表
      e.dead = true; e.vy = -300; e.vx = (player.x + player.w / 2 < e.x + e.w / 2 ? 1 : -1) * 140;
      addStompScore(e.x, e.y - 10);
      sfx('stomp'); hitStopT = 0.035;
      continue;
    }
    // 踩踏判定：只要在“正在下落”(vy>40，比原 100 宽松，轻踩也能触发)且脚落在敌人上 60% 高度内
    const stomp = player.vy > 40 && (player.y + player.h) - e.y < e.h * 0.6;
    if (stomp) {
      /* 反弹力度看"要不要继续连锁"：按住跳 / 撞击瞬间补点一下（预输入仍在缓冲）/ 触屏保底期内，均算主动持按。
         只看 input.jump 的话，触屏一次点按 60~120ms 早已抬起，链式踩怪永远只能拿到 460 弱弹。 */
      player.vy = (input.jump || input.jumpQueued > 0 || player.jumpGrace > 0) ? -STOMP_BOUNCE_HELD : -STOMP_BOUNCE;
      player.y = e.y - player.h;
      buzz(16);                                        // 踩中实感（触屏事件反馈）
      if (e.kind === 'goomba') {
        e.squashT = 0.0001;
        sfx('stomp'); hitStopT = 0.035; addStompScore(e.x, e.y - 10);
      } else if (e.kind === 'para') {                 // 踩跳跳乌龟 → 折翼变红乌龟继续走（原版行为）
        e.kind = 'koopa'; e.red = true;
        sfx('stomp'); hitStopT = 0.035; addStompScore(e.x, e.y - 10);
      } else if (e.kind === 'koopa') {                // 踩乌龟 → 变壳
        const bottom = e.y + e.h;
        e.kind = 'shell'; e.h = 18; e.y = bottom - 18; e.vx = 0;
        sfx('stomp'); hitStopT = 0.035; addStompScore(e.x, e.y - 10);
      } else {                                        // 踩壳：滑行→停，静止→踢飞
        if (Math.abs(e.vx) > 10) e.vx = 0;
        else { e.vx = (player.x + player.w / 2 < e.x + e.w / 2 ? 1 : -1) * SHELL_SPEED; sfx('kick'); }
      }
    } else if (e.kind === 'shell' && Math.abs(e.vx) < 10) {  // 侧面碰静止壳 → 踢飞
      e.vx = (player.x + player.w / 2 < e.x + e.w / 2 ? 1 : -1) * SHELL_SPEED;
      sfx('kick');
    } else {
      hurtPlayer();                                   // 滑行壳/敌人侧面碰撞 → 受伤
    }
  }
}

function killEnemy(e, dir, pts) {
  e.dead = true; e.vy = -300; e.vx = dir * 140;
  addScore(pts === undefined ? PTS_FIRE_KILL : pts, e.x, e.y - 10);
  sfx('stomp'); hitStopT = 0.035;
}

/** 食人花实体：由当前关卡 pipes 中 plant:true 的水管生成，固定在管口中央（地上=管顶朝上，吊管=管底朝下） */
const plants = [];
function buildPlants() {
  plants.length = 0;
  for (const p of cur.pipes) {
    if (!p.plant) continue;
    const down = !!p.top;
    const cx = (p.col + 1) * TILE;
    const mouthY = down ? ((p.row !== undefined ? p.row : 2) + p.h) * TILE : (GROUND_ROW - p.h) * TILE;
    plants.push({
      col: p.col, cx, mouthY, down,
      clock: Math.random() * PLANT_CYCLE,          // 多只随机错相位
      exposed: 0, x: cx - PLANT_HIT_W / 2, y: mouthY, w: PLANT_HIT_W, h: 0,
    });
  }
}
buildPlants();
loadLevel(0); map = overMap;                       // 初始即载入 1-1：标题有背景，避免首帧空地图（resetGame 会重载）

/** 玩家是否站在该食人花所在水管的管口（横向含 2px 容差） */
function playerOnPipe(pl) {
  if (pl.down) return false;                        // 吊管管口在人够不到的上方，无“站口冻结”一说
  if (!player.onGround) return false;
  if (Math.abs(player.y + player.h - pl.mouthY) > 4) return false;
  return player.x + player.w > pl.col * TILE - 2 && player.x < (pl.col + 2) * TILE + 2;
}

/** 四阶段伸缩：伸出 0.8s → 顶端停留 0.4s → 缩回 0.8s → 管内等待 0.6s（匀速 = “缓缓”）
 *  玩家站上管口时冻结在“管内等待”起点并保持全缩回，离开后接着走完周期 */
function updatePlants(dt) {
  const WAIT_START = PLANT_T.rise + PLANT_T.hold + PLANT_T.fall;
  for (const pl of plants) {
    if (playerOnPipe(pl)) { pl.clock = WAIT_START; pl.exposed = 0; }
    else {
      pl.clock = (pl.clock + dt) % PLANT_CYCLE;
      let c = pl.clock;
      if (c < PLANT_T.rise)          pl.exposed = PLANT_RISE * (c / PLANT_T.rise);
      else if ((c -= PLANT_T.rise) < PLANT_T.hold)   pl.exposed = PLANT_RISE;
      else if ((c -= PLANT_T.hold) < PLANT_T.fall)   pl.exposed = PLANT_RISE * (1 - c / PLANT_T.fall);
      else                                           pl.exposed = 0;
    }
    pl.x = pl.cx - PLANT_HIT_W / 2;
    if (pl.down) { pl.y = pl.mouthY; pl.h = pl.exposed; }              // 吊管：自管口向下伸出
    else { pl.y = pl.mouthY - pl.exposed; pl.h = pl.exposed; }
  }
}

/** 食人花 × 玩家：伸出期间接触即受伤（不可踩、不可烧，故不参与 enemies 结算） */
function plantHits() {
  if (player.starT > 0) return;                    // 无敌星：穿过不受伤
  for (const pl of plants) if (pl.exposed > 2 && aabb(player, pl)) { hurtPlayer(); break; }
}

/** 火球（火力形态，或 Boss 房买了「火球术」的小形态）：弹地前进，撞墙熄灭，命中敌人击飞 */
function shootFireball() {
  if (gameState !== 'play') return;
  if (player.mode !== 'fire' && !(bossRoom.active && bossRoom.buffs.fireball)) return;
  if (fireballs.length >= FIREBALL_MAX) return;
  fireballs.push({
    x: player.x + (player.facing > 0 ? player.w : -10), y: player.y + 10,
    w: 10, h: 10, vx: player.facing * FIREBALL_SPEED, vy: 100, t: 0, onGround: false,
  });
  sfx('fire');
}
function updateFireballs(dt) {
  for (let i = fireballs.length - 1; i >= 0; i--) {
    const f = fireballs[i];
    f.t += dt;
    const ovx = f.vx;
    moveEntity(f, dt);
    if (f.onGround) f.vy = -380;                      // 弹地
    if (ovx !== 0 && Math.sign(f.vx) !== Math.sign(ovx)) { fireballs.splice(i, 1); continue; }
    for (const e of enemies) {
      if (e.dead || e.squashT > 0) continue;
      if (aabb(f, e)) {
        if (e.kind === 'koopa') {                     // 火球打乌龟：翻倒成壳
          const bottom = e.y + e.h;
          e.kind = 'shell'; e.h = 18; e.y = bottom - 18; e.vx = 0; e.vy = 0; e.reviveT = 0; e.wobbleT = 0;
          sfx('kick');
        } else if (e.kind === 'shell') {              // 火球打壳：沿火球方向踢出
          e.vx = Math.sign(f.vx) * SHELL_SPEED;
          sfx('kick');
        } else {
          killEnemy(e, Math.sign(f.vx));
        }
        fireballs.splice(i, 1);
        break;
      }
    }
    if (fireballs[i] === f && world === 'over') {      // 火球烧食人花（原版可烧）
      for (let pi = plants.length - 1; pi >= 0; pi--) {
        const pl = plants[pi];
        if (pl.exposed > 4 && aabb(f, pl)) {
          plants.splice(pi, 1);
          addScore(PTS_FIRE_KILL, pl.x, pl.y - 10);
          sfx('kick');
          fireballs.splice(i, 1);
          break;
        }
      }
    }
    if (f.t > FIREBALL_LIFE || f.y > MAP_H * TILE + 40) fireballs.splice(i, 1);
  }
}

/* ========================= 6. 状态机与特效（分数/生命/结算） ========================= */
let coins = 0, score = 0, lives = START_LIVES;
let hiScore = 0; try { hiScore = +(localStorage.getItem('pmario_hi') || 0) || 0; } catch (e) {}
function saveHi() { if (score > hiScore) { hiScore = score; try { localStorage.setItem('pmario_hi', String(hiScore)); } catch (e) {} } }
let gameState = 'title';               // 'title'|'play'|'pause'|'dying'|'pole'|'tohouse'|'flagup'|'tally'|'win'|'gameover'|'pipeIn'|'pipeOut'
let gameTime = 0;
let morphT = 0, morphFrom = 'small';   // 变身定格：>0 时全场暂停，角色新旧形态交替闪烁
let deathByPit = false;                // 本次死亡是否摔坑（摔坑直接 Game Over）
let castleFlagT = -1;                  // 城堡升旗进度（<0 未激活；进城堡后升起）
let hitStopT = 0;                      // 打击顿帧（踩敌/碎砖瞬间微冻结，增强打击感）
let titleSel = 0;                      // 标题界面选关指针（↑↓ 切换）
const TITLE_MENU = { x0: 0, w: 380, h: 42, y0: 292, gap: 46 };   // 选关菜单几何（原版文字菜单风，x0 绘制时按 VIEW_W 居中）
/* ---- 进度存档：解锁关卡数 + 每关最高分（localStorage 持久化） ---- */
let progress = { unlocked: 1, best: {} };
try {
  const saved = JSON.parse(localStorage.getItem('pmario_progress') || 'null');
  if (saved && saved.unlocked >= 1) progress = saved;
} catch (_) {}
function saveProgress() { try { localStorage.setItem('pmario_progress', JSON.stringify(progress)); } catch (_) {} }
const levelLocked = i => i >= progress.unlocked;      // 第 i 关是否未解锁
let levelStartScore = 0;                              // 本关起始分（算单关得分用）
let hurry = false;                     // 剩余时间 ≤100 的 Hurry-up 状态
let coinT = 0;
let deathT = 0, poleT = 0, poleBonus = 0, flagProg = 0, timeBonus = 0;
const effects = [];                    // {type:'coin'|'text'|'frag', ...}
const FX_POOL  = [];                   // 特效对象池：死亡粒子回收复用，防 GC 抖动
const bumps  = new Map();              // "tx,ty" -> {t} 砖块弹跳动画
const multiBricks = new Map();         // "tx,ty" -> {left} 十金币砖剩余次数
const starBricks = new Set();          // "tx,ty" 星星砖已出货标记：出货后还原为普通砖，防重复顶星
let comboStreak = 0;                   // 连踩计数：不落地逐档升级，落地/受伤清零
const enemies = [], items = [], fireballs = [];

function bumpTile(tx, ty) { bumps.set(tx + ',' + ty, { t: 0 }); }
/** 特效入池取用：优先复用回收对象 */
function fxPush(o) {
  const e = FX_POOL.pop() || {};
  for (const k in o) e[k] = o[k];
  effects.push(e);
}

function addScore(n, x, y) {
  score += n;
  if (x !== undefined) fxPush({ type: 'text', x, y, vy: -70, t: 0, life: 0.7, txt: '+' + n });
}

/** 得金币统一入口：+200 分 + 弹币特效 + 音效；集满 100 枚换 1UP（原版规则） */
function gainCoin(x, y, pop) {
  coins++;
  addScore(PTS_COIN, x, y - (pop ? 8 : 0));
  if (pop) fxPush({ type: 'coin', x, y, vy: -420, t: 0, life: 0.55 });
  sfx('coin');
  if (coins >= 100) {
    coins -= 100; lives = Math.min(99, lives + 1);
    sfx('oneup');
    fxPush({ type: 'text', x, y: y - 24, vy: -70, t: 0, life: 1.2, txt: '100枚 1UP!', col: '#7ae048' });
  }
}

/** 连踩计分：100→200→400→…→4000 封顶（COMBO_TABLE 八档）；空中不落地连击有效 */
function addStompScore(x, y) {
  comboStreak = Math.min(comboStreak + 1, COMBO_TABLE.length);
  const pts = COMBO_TABLE[comboStreak - 1];
  score += pts;
  fxPush({ type: 'text', x, y, vy: -70, t: 0, life: 0.7,
           txt: '+' + pts + (comboStreak > 1 ? ' ×' + comboStreak : '') });
}

/** 死亡：定身上跃 → 落出屏幕 → 扣命回重生点 / Game Over */
function die(pitFall) {
  if (gameState !== 'play') return;
  gameState = 'dying'; deathT = 0; deathByPit = !!pitFall;
  player.vy = pitFall ? -300 : -760;   // 摔坑时人已在屏外，小跳只为动画一致
  player.vx = 0;
  sfx('death');
}
function updateDying(dt) {
  deathT += dt;
  player.vy += GRAVITY * dt;
  player.y += player.vy * dt;
  if (deathT > 1.7) {
    if (bossRoom.active) bossRoomFail();                  // Boss 房内死亡：先按房内规则结算（花费不退、余额折半），再走原有重生/GameOver
    if (challengeRoom.active) closeChallenge();           // 挑战房内死亡：视同失败出房（清状态与板栗仔），走原有重生流程
    if (deathByPit) { saveHi(); gameState = 'gameover'; return; }   // 摔坑：直接 Game Over（用户规则）
    lives--;
    if (lives > 0 && gameTime < TIME_LIMIT) { respawnToCheckpoint(); gameState = 'play'; }
    else { saveHi(); gameState = 'gameover'; }      // 命数耗尽或倒计时已归零 → 直接 Game Over
  }
}

/** 碰到旗杆 → 抓杆下滑，按触碰高度给加成分 */
function checkFlag() {
  const p = player;
  if (p.x + p.w < GOAL_COL * TILE + 10) return;
  gameState = 'pole'; poleT = 0;
  p.x = GOAL_COL * TILE + 8; p.vx = 0;
  /* 原版四档：杆顶球区 5000 / 上 1/3 800 / 中 1/3 400 / 下 1/3 200（与 drawFlag 杆高 8 格对齐） */
  const topY = GROUND_ROW * TILE - 8 * TILE, poleH = 8 * TILE;
  if (p.y <= topY + TILE)                  poleBonus = 5000;
  else if (p.y <= topY + poleH / 3)        poleBonus = 800;
  else if (p.y <= topY + poleH * 2 / 3)    poleBonus = 400;
  else                                     poleBonus = 200;
  addScore(poleBonus, p.x, p.y - 10);
  sfx('flag');
}
function updatePole(dt) {
  poleT += dt;
  player.y = Math.min(GROUND_ROW * TILE - player.h, player.y + POLE_SLIDE_V * dt);
  flagProg = Math.min(1, flagProg + dt * 1.2);        // 旗子同步降下
  if (poleT > 1.6 && player.y >= GROUND_ROW * TILE - player.h - 1) {
    gameState = 'tohouse'; seqT = 0;                  // 滑到底 → 自动走向城堡
  }
}

/* ---- 过关终幕：走进城堡 → 升旗+烟花 → 剩余时间×50 折算（自适应速率）→ 结算 ---- */
let seqT = 0, fwT = 0, fwLeft = 0, fwTotal = 0, tallyAcc = 0, timeLeftInt = 0, tallyTotal = 0, tallySecAcc = 0;
function updateToHouse(dt) {
  const p = player;
  p.facing = 1; p.vx = HOUSE_WALK_V; p.x += p.vx * dt;
  p.y = GROUND_ROW * TILE - p.h; p.onGround = true;   // 落地状态：否则沿用抓杆时的 onGround=false，全程画成跳姿
  p.runT += dt * 6;
  if (p.x > (CASTLE_COL + 1.6) * TILE) {              // 走进门洞（城堡画在角色之上即“没入”）
    p.vx = 0;
    gameState = 'flagup'; seqT = 0; fwT = 0; castleFlagT = 0;   // 城堡升旗开始
    timeLeftInt = Math.max(0, Math.ceil(TIME_LIMIT - gameTime));
    const fd = timeLeftInt % 10;                        // 原版规则：剩余时间个位 1/3/6 → 对应发数烟花
    fwLeft = fd === 1 ? 1 : fd === 3 ? 3 : fd === 6 ? 6 : 0;
    fwTotal = fwLeft;
  }
}
function updateFlagUp(dt) {
  seqT += dt;
  castleFlagT += dt;
  flagProg = Math.max(0, flagProg - dt * 0.9);        // 旗子升回杆顶
  fwT += dt;
  if (fwT >= FIREWORK_INTERVAL && fwLeft > 0) { fwT = 0; fwLeft--; spawnFirework(); sfx('pop'); }
  if (seqT > (fwTotal > 0 ? 2.2 : 1.1) && fwLeft === 0) { gameState = 'tally'; tallyAcc = 0; tallyTotal = timeLeftInt; tallySecAcc = 0; }
}
function updateTally(dt) {
  // 自适应折算速率：整段固定 ~1.4s 放完（每秒 50 分不变），避免剩余秒数越多结算越拖沓
  const perSec = Math.max(60, tallyTotal / 1.4);
  tallySecAcc += dt * perSec;
  const dec = Math.min(timeLeftInt, Math.floor(tallySecAcc));
  if (dec > 0) { tallySecAcc -= dec; timeLeftInt -= dec; score += 50 * dec; timeBonus += 50 * dec; }
  if (timeLeftInt <= 0) completeLevel();     // 折算放完：有下一关则保分换关，否则最终结算
}
/** 旗杆上空爆一朵 8 向烟花 */
function spawnFirework() {
  const cx = (GOAL_COL - 1 + Math.random() * 6) * TILE;
  const cy = (3 + Math.random() * 4) * TILE;
  const cols = ['#ff5a5a', '#ffd23f', '#7ae048', '#5ad0ff', '#ff9de2', '#ffffff'];
  const col = cols[Math.random() * cols.length | 0];
  for (let i = 0; i < FIREWORK_PARTS; i++) {
    const a = i / FIREWORK_PARTS * Math.PI * 2, sp = 110 + Math.random() * 70;
    fxPush({ type: 'firework', x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
             t: 0, life: FIREWORK_LIFE, col });
  }
}

/** 载入并开始第 idx 关的运行时状态：不动 score/lives/coins，供 resetGame 与通关换关共用 */
function startLevel(idx) {
  loadLevel(idx);                            // 写入 MAP_W/GOAL_COL/CASTLE_COL/TIME_LIMIT/LEVEL_NAME + overMap/underMap/spawns
  map = overMap; world = 'over';
  gameTime = 0;
  deathT = 0; poleT = 0; poleBonus = 0; flagProg = 0; timeBonus = 0;
  multiBricks.clear(); starBricks.clear(); bumps.clear();
  comboStreak = 0; seqT = 0; fwLeft = 0; fwTotal = 0; morphT = 0; hurry = false; deathByPit = false;
  castleFlagT = -1;
  while (effects.length) FX_POOL.push(effects.pop());
  if (bossRoom.active) closeBossRoom(false);          // 换关/重开：关闭 Boss 房，防残留状态污染地上世界
  enemies.length = 0; items.length = 0; fireballs.length = 0;
  buildPlants();
  player.mode = 'small'; player.w = PLAYER_W; player.h = PLAYER_H; player.invulnT = 0; player.starT = 0; player.crouch = false;
  levelStartScore = score;                         // 记录本关起始分（过关时算单关得分入档）
  checkpoint = { x: SPAWN.x, y: SPAWN.y };
  respawn();
  camX = Math.max(0, Math.min(checkpoint.x + player.w / 2 - VIEW_W * 0.42, MAP_W * TILE - VIEW_W));   // 相机归位：防上一关残位导致新关敌人按旧镜头错生成/错裁剪
  gameState = 'play';
}
/** 整局重开：归零分数/生命/金币后从第 1 关开始 */
function resetGame() {
  levelIdx = titleSel;                             // 从标题所选关卡开始
  coins = 0; score = 0; lives = START_LIVES;
  startLevel(titleSel);
}
/** 通关推进：还有下一关则保分换关，否则进入最终结算 */
function completeLevel() {
  const gained = score - levelStartScore;            // 本关单关得分（含时间加成）
  progress.best[levelIdx] = Math.max(progress.best[levelIdx] || 0, gained);
  progress.unlocked = Math.max(progress.unlocked, Math.min(LEVELS.length, levelIdx + 2));
  saveProgress();
  if (levelIdx < LEVELS.length - 1) { startLevel(levelIdx + 1); sfx('win'); }
  else { gameState = 'win'; saveHi(); sfx('win'); }
}

/* ---- 地下奖励房：按 ↓ 入管 → 滑入动画 → 切世界；右侧横管走出 → 回地上出口管 ---- */
function tryEnterPipe() {
  if (world !== 'over' || !input.down || !player.onGround) return;
  for (const p of cur.pipes) {
    if (p.enter === undefined) continue;              // enter = 目标奖励房索引（0 合法，故用 undefined 判缺省）
    if (Math.abs(player.y + player.h - (GROUND_ROW - p.h) * TILE) > 4) continue;   // 必须站在管口
    if (player.x + player.w > p.col * TILE - 2 && player.x < (p.col + 2) * TILE + 2) {
      if (player.crouch) {                          // 入管前先起身（原版蹲着入管，起身防卡碰撞盒）
        const bottom = player.y + player.h;
        player.crouch = false; player.h = BIG_H; player.y = bottom - BIG_H;
      }
      roomIdx = p.enter | 0;
      gameState = 'pipeIn'; seqT = 0;
      player.x = (p.col + 1) * TILE - player.w / 2; // 对齐管口中央
      player.vx = 0; player.vy = 0;
      sfx('pipe');
      return;
    }
  }
}
function updatePipeIn(dt) {
  seqT += dt; gameTime += dt;
  player.y += 90 * dt;                               // 沿管壁下滑（渲染侧同步渐隐）
  if (seqT > 0.85) enterBonusRoom();
}
function enterBonusRoom() {
  const room = cur.unders[roomIdx];
  /* boss/challenge 房每次进入都重建地图：房内会拆闸门/吃掉金币/顶砖，重进须拿干净地图 */
  if (room.type === 'boss') underMaps[roomIdx] = buildBossRoomMap();
  else if (room.type === 'challenge') underMaps[roomIdx] = buildChallengeMap();
  world = 'under'; map = underMaps[roomIdx]; MAP_W = room.w; camX = 0;
  enemies.length = 0; items.length = 0; fireballs.length = 0;
  player.x = 2 * TILE; player.y = GROUND_ROW * TILE - player.h;
  player.vx = 0; player.vy = 0;
  player.invulnT = Math.max(player.invulnT, 1.0);
  morphT = 0;
  if (room.type === 'boss') enterBossRoom();           // 资源管理 Boss 房：强变小 + 发房内资金 + 生成 Boss
  else if (room.type === 'challenge') enterChallenge(); // 机关挑战房：开 30s 倒计时 + 三机关待点亮
  gameState = 'play';
}
/** 地下右侧横管出口：走到管口右行 → 滑入横管 → 回本房 exitCol 的出口管（出口管须为 h2） */
function checkExitPipeTrigger() {
  if (world !== 'under' || !player.onGround) return;
  if (bossRoom.active) return;                         // Boss 房出口在入口横管（按 ↓ 主动退出），右行不出房
  const ex = (cur.unders[roomIdx].w - 4) * TILE;
  if (player.x + player.w / 2 > ex + 10 && (input.right || player.vx > 20)) {
    gameState = 'pipeOut'; seqT = 0;
    player.vx = 0; player.vy = 0;
    sfx('pipe');
  }
}
function updatePipeOut(dt) {
  seqT += dt; gameTime += dt;
  player.facing = 1; player.x += 95 * dt; player.runT += dt * 6;
  if (seqT > 0.7 || player.x > (cur.unders[roomIdx].w - 3) * TILE) exitBonusRoom();
}
function exitBonusRoom() {
  if (bossRoom.active) {
    const cleared = bossRoom.state === 'clear';        // 在 closeBossRoom 前取样（close 会清 state）
    closeBossRoom(true);                                // Boss 房：出房即清除房内能力并恢复原形态
    if (cleared && levelIdx === LEVELS.length - 1) {    // 最后一关(1-4)打赢 Boss：直接通关，不再回走廊
      completeLevel();
      return;
    }
  }
  if (challengeRoom.active) closeChallenge();            // 挑战房：出房即清空开关/倒计时（下次重进重来）
  world = 'over'; map = overMap; MAP_W = cur.w;
  const ec = cur.unders[roomIdx].exitCol;
  player.x = (ec + 1) * TILE - player.w / 2;          // 出口管口中央
  player.y = (GROUND_ROW - 2) * TILE - player.h;
  player.vx = 0; player.vy = 0;
  player.invulnT = Math.max(player.invulnT, 1.0);
  for (const s of spawns) if (s.col < ec + 3) s.done = true;   // 身后的敌人不再补生成
  checkpoint = { x: player.x, y: player.y };
  camX = Math.max(0, Math.min(player.x + player.w / 2 - VIEW_W * 0.42, MAP_W * TILE - VIEW_W));
  gameState = 'play';
}

/* ==================== 6.5 资源管理 Boss 奖励房 ====================
 * 设计目的：把金币从“分数/1UP 货币”变成可支配的战斗资源。玩家带着固定预算（100）
 * 在「买能力压低战斗难度」与「留金币换结算收益」之间取舍，因此三条约束缺一不可：
 *   ① 房内金币独立结算（不与全局 coinCount 混记）→ 预算才有意义；
 *   ② 能力仅房内有效（出房即清除）→ 不能变成永久数值膨胀；
 *   ③ 死亡不退还已花费、余额只折 50% → 风险真正存在。
 * 无敌只免疫伤害、不直接杀掉 Boss：否则“防御型商品”严格优于“攻击型商品”，取舍消失。
 * ================================================================== */
const BOSS_MAX_HP = 5;             // 踩头/火球各扣 1 血
const BR_INVINCIBLE_T = 8;         // 无敌持续（秒）
const BR_SHOP_RESPAWN_T = 10;      // 可重复购买砖的恢复冷却（秒）
const BR_COIN_DROP_T = 3;          // 战斗中金币雨间隔（秒）
const BR_HAMMER_LIFE = 5;          // 锤子存在时长（秒）
const BOSS_STUN_T = 1, BOSS_HURT_T = 0.3, BOSS_DEAD_T = 2;
const BR_SPEED_MUL = 1.3;          // 加速跑倍率

/* 房内运行时状态（单实例：一次只可能在一间房内，无需对象池） */
const bossRoom = {
  active: false, state: '', seqT: 0, coins: 0, origMode: 'small', pending: null,
  buffs: { doubleJump: false, invincible: 0, speedBoost: false, fireball: false, canDoubleJump: true },
  shop: {}, boss: null, hammers: [], drops: [], dropT: 0,
  atHome: false, msg: null, msgT: 0, quitT: 0, downArmed: false,
};

/** 房内提示（出房后仍短暂可见，用于承载结算反馈） */
function roomMsg(txt, sec) { bossRoom.msg = txt; bossRoom.msgT = sec; }

/** 形态直切：不走 setMode/shrinkToSmall，避免出房瞬间被变身定格与无敌帧干扰 */
function setRoomMode(m) {
  const bottom = player.y + player.h;
  player.mode = m; player.crouch = false;
  if (m === 'small') { player.w = PLAYER_W; player.h = PLAYER_H; }
  else { player.w = BIG_W; player.h = BIG_H; }
  player.y = bottom - player.h;
}

/** 入房：存档原形态 → 强制变小 → 发房内资金 → 清空能力与商品状态 */
function enterBossRoom() {
  const B = bossRoom;
  B.active = true; B.state = 'enter'; B.seqT = 0; B.quitT = 0; B.downArmed = false;
  B.coins = BR_INIT_COINS; B.origMode = player.mode; B.pending = null;
  B.buffs = { doubleJump: false, invincible: 0, speedBoost: false, fireball: false, canDoubleJump: true };
  B.shop = {};
  for (const it of BR_SHOP) B.shop[it.col] = { bought: false, respawnT: 0, flashT: 0 };
  B.hammers.length = 0; B.drops.length = 0; B.dropT = 0; B.atHome = false;
  B.boss = { x: 36 * TILE, y: GROUND_ROW * TILE - 48, w: 32, h: 48, vx: 0, vy: 0,
             hp: BOSS_MAX_HP, maxHp: BOSS_MAX_HP, phase: 1, facing: -1, state: 'idle',
             atkCd: 1.2, fireCd: 5, act: 0, stunT: 0, hurtT: 0, deadT: 0, runT: 0, flame: null };
  setRoomMode('small');                              // 强制变小：把“形态”也变成可交易的资源
  player.invulnT = Math.max(player.invulnT, 0.6);
  roomMsg('资源管理 Boss 房！用金币买能力，击败 Boss！', 3);
  sfx('star');
}

/** 出房清理：房内能力一律作废；restore=true 时恢复原形态并发放稀有奖励（死亡路径由 respawnToCheckpoint 统一重置） */
function closeBossRoom(restore) {
  const B = bossRoom;
  B.buffs = { doubleJump: false, invincible: 0, speedBoost: false, fireball: false, canDoubleJump: true };
  B.hammers.length = 0; B.drops.length = 0; B.boss = null;
  if (restore) {
    setRoomMode(B.origMode);
    if (B.pending === 'flower' && player.mode !== 'fire') { setRoomMode('fire'); sfx('grow'); roomMsg('奖励：火之花！', 2); }
    else if (B.pending === 'star') { player.starT = STAR_TIME; sfx('star'); roomMsg('奖励：无敌星！', 2); }
  }
  B.pending = null; B.active = false; B.state = ''; B.coins = 0; B.atHome = false;
}

/** 房内金币折算入全局：按原版口径计分，集满 100 枚照常换 1UP */
function settleRoomCoins(n) {
  if (n <= 0) return;
  coins += n; score += n * PTS_COIN;
  while (coins >= 100) { coins -= 100; lives = Math.min(99, lives + 1); sfx('oneup'); }
}

/** 房内拾币统一入口：只加房内余额，不触碰全局 coins */
function roomCoin(x, y) {
  bossRoom.coins++;
  fxPush({ type: 'coin', x, y, vy: -360, t: 0, life: 0.5 });
  sfx('coin');
}

/* ---- 商店：顶起 T_SHOP 砖 = 购买（余额不足只闪价不扣钱） ---- */
function buyShopItem(col, row) {
  const B = bossRoom, it = BR_SHOP.find(s => s.col === col);
  if (!it) return;
  const st = B.shop[col] || (B.shop[col] = { bought: false, respawnT: 0, flashT: 0 });
  bumpTile(col, row);
  if (st.bought) { sfx('bump'); return; }
  if (B.coins < it.price) {
    st.flashT = 1; sfx('bump');                              // 余额不足：闷响 + 价格闪红 1 秒
    roomMsg(it.name + ' 需要 ' + it.price + ' 金币（现有 ' + B.coins + '）', 1.6);
    return;
  }
  B.coins -= it.price;
  applyBuff(it.key);
  sfx('grow'); buzz(20); hitStopT = 0.03;
  fxPush({ type: 'text', x: col * TILE + 2, y: (row + 1) * TILE + 14, vy: -70, t: 0, life: 1,
           txt: '-' + it.price, col: '#ffd23f' });
  map[row][col] = T_QUSED; st.bought = true;
  if (it.repeat) st.respawnT = BR_SHOP_RESPAWN_T;            // 无敌砖 10 秒后恢复可购（可续命）
}
function applyBuff(k) {
  const bf = bossRoom.buffs;
  if (k === 'invincible') bf.invincible = BR_INVINCIBLE_T;    // 重复购买：刷新为满 8 秒
  else bf[k] = true;
  if (k === 'doubleJump') bf.canDoubleJump = true;
}

/* ---- Boss 战 ---- */
/** 扔锤：阶段 3 固定双发，其余 1-2 发随机（越贴近越难躲，故给最短距离阈值） */
function throwHammers(b) {
  const n = b.phase >= 3 ? 2 : 1 + (Math.random() < 0.5 ? 1 : 0);
  for (let i = 0; i < n; i++) {
    bossRoom.hammers.push({
      x: b.x + (b.facing > 0 ? b.w - 6 : -10), y: b.y + 4, w: 16, h: 16,
      vx: b.facing * (150 + i * 70 + Math.random() * 40), vy: -430 - Math.random() * 60,
      rot: 0, life: BR_HAMMER_LIFE, bounce: 0,
    });
  }
  sfx('kick');
}
/** 逃跑惩罚：激活后退回商店区 → Boss 回初始位并回血 1 格（最多回满），杜绝反复进出磨血 */
function retreatBoss() {
  const B = bossRoom, b = B.boss;
  b.x = 36 * TILE; b.vx = 0; b.flame = null; b.act = 0; b.stunT = 0; b.atkCd = 1;
  b.hp = Math.min(b.maxHp, b.hp + 1);
  B.hammers.length = 0; B.atHome = true;
  roomMsg('库巴退回巢穴并恢复 1 格血量', 2);
  sfx('bump');
}
/** Boss 掉血：踩头 → 眩晕 1 秒 + 玩家反弹；火球 → 硬直 0.3 秒 */
function bossDamage(kind) {
  const B = bossRoom, b = B.boss;
  if (!b || b.state === 'dead') return;
  b.hp--; b.hurtT = 0.2;
  if (kind === 'stomp') { b.stunT = BOSS_STUN_T; b.state = 'stunned'; player.vy = -400; sfx('stomp'); }
  else { b.stunT = BOSS_HURT_T; b.state = 'hurt'; sfx('kick'); }
  hitStopT = 0.05; buzz(24);
  addScore(PTS_STOMP, b.x, b.y - 10);
  if (b.hp <= 0) { b.state = 'dead'; b.deadT = 0; b.stunT = 0; b.flame = null; sfx('pop'); }
}
/** 胜利结算：余额 ×2 入全局 + 1UP + 稀有奖励（出房瞬间生效），3 秒后自动出房 */
function bossVictory() {
  const B = bossRoom, b = B.boss;
  B.state = 'clear'; B.seqT = 0;
  B.hammers.length = 0; B.drops.length = 0; if (b) b.flame = null;
  settleRoomCoins(B.coins * 2);
  B.coins = 0;                                          // 余额已结清，防“结算后再死亡”二次折算
  lives = Math.min(99, lives + 1);
  B.pending = Math.random() < 0.5 ? 'flower' : 'star';
  if (b) for (let i = 0; i < 18; i++) {                // 烟花：绕 Boss 中心 18 向爆开
    const a = i / 18 * Math.PI * 2, sp = 110 + Math.random() * 80;
    fxPush({ type: 'firework', x: b.x + b.w / 2, y: b.y + 10, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
             t: 0, life: FIREWORK_LIFE, col: ['#ffd23f', '#ff5a5a', '#7ae048', '#5ad0ff'][i % 4] });
  }
  roomMsg('BOSS 击破！剩余金币 ×2 + 1UP', 3);
  stinger('bossWin');                                  // 专属击破动机（不复用过关 sfx('win')，避免与每关结算撞车）
}
/** 死亡结算：已花费不退还，余额 50% 折算（updateDying 在重生前调用） */
function bossRoomFail() {
  const B = bossRoom;
  if (!B.active) return;
  if (B.state === 'clear' || B.state === 'leave') { closeBossRoom(false); return; }   // 已结清：只清理，不二次折算
  B.state = 'dead';
  const back = Math.floor(B.coins * 0.5);
  settleRoomCoins(back); B.coins = 0;
  closeBossRoom(false);
  roomMsg('挑战失败… 剩余金币 50% 返还 ' + back + ' 枚', 2.5);
  stinger('bossLose');                                 // 死亡音早在 1.7 秒前放完，这里补失败动机
}

/** 金币雨：战斗期间每 3 秒从天花板掉 3-5 枚（只计房内余额，落地静止 1 秒即消失） */
function spawnCoinRain() {
  const B = bossRoom, n = 3 + (Math.random() * 3 | 0);
  for (let i = 0; i < n; i++) {
    const col = BR_ARENA_COL + 1 + (Math.random() * 13 | 0);   // 竞技场随机列 26~38
    B.drops.push({ x: col * TILE + 6, y: 2 * TILE, w: 20, h: 28, vy: 0, rest: 0 });
  }
  if (B.drops.length > 10) B.drops.splice(0, B.drops.length - 10);                   // 池上限 10
}

/** 锤子：重力抛物线 + 落地反弹 2 次 + 撞墙/超时消失；玩家不可踩（旋转有刃，接触即伤） */
function updateHammers(dt) {
  const B = bossRoom;
  for (let i = B.hammers.length - 1; i >= 0; i--) {
    const h = B.hammers[i];
    h.life -= dt; h.vy = Math.min(h.vy + GRAVITY * dt, MAX_FALL);
    h.x += h.vx * dt; h.y += h.vy * dt; h.rot += dt * 11;
    const midRow = Math.floor((h.y + h.h / 2) / TILE);
    if (isSolid(Math.floor(h.x / TILE), midRow) || isSolid(Math.floor((h.x + h.w) / TILE), midRow) || h.life <= 0) {
      B.hammers.splice(i, 1); continue;
    }
    if (h.vy > 0) {
      const row = Math.floor((h.y + h.h) / TILE);
      if (isSolid(Math.floor((h.x + h.w / 2) / TILE), row)) {
        if (++h.bounce > 2) { B.hammers.splice(i, 1); continue; }
        h.y = row * TILE - h.h; h.vy = -440; sfx('bump');
      }
    }
    if (aabb(player, h)) {
      B.hammers.splice(i, 1);
      if (B.buffs.invincible > 0) sfx('kick');           // 无敌：撞碎锤子
      else hurtPlayer();
    }
  }
}
function updateDrops(dt) {
  const B = bossRoom;
  for (let i = B.drops.length - 1; i >= 0; i--) {
    const d = B.drops[i];
    if (d.rest > 0) { d.rest -= dt; if (d.rest <= 0) B.drops.splice(i, 1); continue; }
    d.vy = Math.min(d.vy + GRAVITY * dt, MAX_FALL); d.y += d.vy * dt;
    const row = Math.floor((d.y + d.h) / TILE);
    if (d.vy > 0 && isSolid(Math.floor((d.x + d.w / 2) / TILE), row)) { d.y = row * TILE - d.h; d.vy = 0; d.rest = 1; }
    if (aabb(player, d)) { B.drops.splice(i, 1); roomCoin(d.x, d.y - 6); }
  }
}

/** Boss AI：idle/chase/throwHammer/breatheFire/stunned/dead；阶段只随血量升，不随回血降 */
function updateBossFight(dt) {
  const B = bossRoom, b = B.boss, p = player;
  if (!b) return;
  if (b.hurtT > 0) b.hurtT = Math.max(0, b.hurtT - dt);
  if (b.state === 'dead') { b.deadT += dt; b.vx = 0; if (b.deadT > BOSS_DEAD_T) bossVictory(); return; }
  const wantPhase = b.hp >= 3 ? 1 : (b.hp === 2 ? 2 : 3);
  if (wantPhase > b.phase) {
    b.phase = wantPhase;
    roomMsg('Boss 狂暴了！', 2); sfx('hurry');           // 阶段 2 解锁喷火、速度+25%、攻击更密
  }
  const dx = (p.x + p.w / 2) - (b.x + b.w / 2), adx = Math.abs(dx);
  b.facing = dx < 0 ? -1 : 1;
  b.atkCd = Math.max(0, b.atkCd - dt); b.fireCd = Math.max(0, b.fireCd - dt);
  if (b.stunT > 0) { b.stunT -= dt; b.vx = 0; b.flame = null; if (b.stunT <= 0) b.state = 'chase'; }
  else if (b.act > 0) {                                 // 动作进行中：定身（喷火/扔锤的“停下”代价）
    b.act -= dt; b.vx = 0;
    if (b.act <= 0) { b.state = 'chase'; b.flame = null; }
  } else if (b.phase >= 2 && b.fireCd <= 0 && adx > TILE && adx < 5.6 * TILE) {
    b.state = 'breatheFire'; b.act = 1; b.fireCd = 4; b.vx = 0; sfx('fire');
  } else if (b.atkCd <= 0 && adx > 70) {
    b.state = 'throwHammer'; b.act = 0.4; b.atkCd = 3 - b.phase * 0.5; throwHammers(b);
  } else {
    b.state = 'chase';
    b.vx = (adx > 44 ? Math.sign(dx) : 0) * (60 + b.phase * 20);
    b.runT += dt * 6;
    if (b.phase >= 3 && b.atkCd <= 0) { throwHammers(b); b.atkCd = 3 - b.phase * 0.5; }   // 阶段3：移动中也能扔
  }
  b.x += b.vx * dt;
  b.x = Math.max(BR_ARENA_COL * TILE, Math.min((BR_W - 2) * TILE - b.w, b.x));
  b.y = GROUND_ROW * TILE - b.h;                        // Boss 不跳台：两座高台是玩家的躲避位
  /* 直线火焰（长 5 格）：贴脸威胁，无敌可穿、其余按受击 */
  b.flame = (b.state === 'breatheFire' && b.stunT <= 0)
    ? { x: b.facing > 0 ? b.x + b.w - 6 : b.x - 5 * TILE + 6, y: b.y + 11, w: 5 * TILE, h: 16 }
    : null;
  if (b.flame && aabb(p, b.flame) && !(B.buffs.invincible > 0)) hurtPlayer();
  /* 身体接触：只有踩踏掉血；侧面接触受击（无敌时免疫但不掉血） */
  if (p.invulnT <= 0 && aabb(p, b)) {
    const stomp = p.vy > 40 && (p.y + p.h) - b.y < 16;
    if (stomp) { p.y = b.y - p.h; p.onGround = false; bossDamage('stomp'); }
    else if (B.buffs.invincible <= 0) hurtPlayer();
  }
  /* 火球命中（集中在此判定，避免改动 updateFireballs） */
  for (let i = fireballs.length - 1; i >= 0; i--) {
    const f = fireballs[i];
    if (aabb(f, b)) { fireballs.splice(i, 1); bossDamage('fire'); }
  }
  /* 金币雨计时 */
  B.dropT += dt;
  if (B.dropT >= BR_COIN_DROP_T) { B.dropT = 0; spawnCoinRain(); }
}

/** 主动退出：滑进入口横管，余额 50% 折算、不触发 Boss 战 */
function startBossRoomLeave() {
  const B = bossRoom;
  B.state = 'leave'; B.seqT = 0;
  player.vx = 0; player.vy = 0;
  const back = Math.floor(B.coins * 0.5);
  settleRoomCoins(back); B.coins = 0;
  roomMsg('主动退出：余额 50% 折算 ' + back + ' 枚', 2.5);
  sfx('pipe');
}

/** 房内主更新：状态机 + 各子系统（由 update() 在 play 分支内调用） */
function updateBossRoom(dt) {
  const B = bossRoom;
  if (!B.active) return;
  if (B.buffs.invincible > 0) B.buffs.invincible = Math.max(0, B.buffs.invincible - dt);
  for (const key in B.shop) {                           // 商品砖的闪红计时与恢复冷却
    const s = B.shop[key];
    if (s.flashT > 0) s.flashT = Math.max(0, s.flashT - dt);
    if (s.respawnT > 0) {
      s.respawnT -= dt;
      if (s.respawnT <= 0) { s.bought = false; map[BR_SHOP_ROW][+key] = T_SHOP; sfx('sprout'); }
    }
  }
  if (B.state === 'enter') { B.seqT += dt; if (B.seqT > 0.5) B.state = 'shop'; }
  else if (B.state === 'clear') { B.seqT += dt; if (B.seqT > 3) exitBonusRoom(); return; }
  else if (B.state === 'leave') {
    B.seqT += dt; player.vx = 0; player.facing = -1; player.x -= 90 * dt; player.runT += dt * 6;
    if (B.seqT > 0.7) exitBonusRoom();
    return;
  }
  const pcol = Math.floor((player.x + player.w / 2) / TILE);
  /* 主动退出：入口区站稳按 ↓ 0.5 秒；downArmed 要求先松开一次，杜绝入房瞬间沿用入管按键误触 */
  if (!input.down) B.downArmed = true;
  const canQuit = (B.state === 'shop' || B.state === 'boss') && player.onGround && pcol <= BR_EXIT_ARM_COL;
  if (canQuit && input.down && B.downArmed) { B.quitT += dt; if (B.quitT > 0.5) startBossRoomLeave(); }
  else if (!canQuit) B.quitT = 0;
  /* 竞技场激活 / 回巢惩罚 */
  if (B.state === 'shop' && pcol >= BR_ARENA_COL) {
    B.state = 'boss'; B.atHome = false;
    if (B.boss) { B.boss.state = 'idle'; B.boss.act = 0.5; }   // 开场 0.5 秒站立观察（规格 idle 档）
    roomMsg('库巴苏醒了！', 2); sfx('hurry');
  } else if (B.state === 'boss') {
    if (pcol >= BR_ARENA_COL) B.atHome = false;
    else if (!B.atHome && B.boss && B.boss.hp > 0 && B.boss.state !== 'dead') retreatBoss();
  }
  if (B.state === 'boss') {
    if (B.atHome) {                                      // 玩家已退出竞技场：钉回巢穴，战斗暂停（不追/不打/不掉金币）
      const b = B.boss;
      if (b && b.state !== 'dead') { b.x = 36 * TILE; b.y = GROUND_ROW * TILE - b.h; b.vx = 0; b.state = 'idle'; b.act = 0; b.flame = null; }
    } else {
      updateBossFight(dt); updateHammers(dt); updateDrops(dt);
    }
  }
}

/* ---- Boss 房绘制：库巴 / 锤子 / 火焰 / 入口横管（纯程序化像素，与全游戏零外链素材一致） ---- */
function drawBowser(b) {
  const sx = Math.round(b.x - camX), sy = Math.round(b.y);
  if (sx < -64 || sx > VIEW_W + 64) return;
  const dead = b.state === 'dead';
  ctx.save();
  ctx.translate(sx + (b.facing > 0 ? 0 : b.w), sy);
  ctx.scale(b.facing > 0 ? 1 : -1, 1);                  // 素材朝右：朝左时镜像（与 drawEnemy 同法）
  if (dead) {                                           // 死亡：缩小消失 + 全身转红
    const k = Math.max(0.15, 1 - b.deadT / BOSS_DEAD_T);
    ctx.translate(b.w / 2, b.h); ctx.scale(k, k); ctx.translate(-b.w / 2, -b.h);
  } else if (b.hurtT > 0 && Math.floor(b.hurtT * 24) % 2 === 0) ctx.globalAlpha = 0.5;
  const C = c => dead ? '#d82800' : c;
  const px = (x, y, w, h, c) => {                     // 部件 = 黑描边 + 本体填色（与角色/敌人素材同风格）
    if (!dead) rect(ctx, x - 1, y - 1, w + 2, h + 2, '#000000');
    rect(ctx, x, y, w, h, C(c));
  };
  const G = '#00a800', D = '#005800', T = '#fcd8a8', Y = '#e8a000',
        R = '#d82800', W = '#fcfcfc', M = '#7c0800', O = '#ff8000';
  const step = (b.state === 'chase' && Math.abs(b.vx) > 10) ? (Math.floor(b.runT) % 2) : 0;
  const bob = (b.state === 'throwHammer' || b.state === 'breatheFire') ? -2 : 0;
  ctx.translate(0, bob);
  px(-6, 28, 9, 6, D);                                // 尾（压暗，藏在甲后）
  px(0, 16, 17, 21, D);                               // 背甲（深绿大块）
  px(1, 12, 4, 5, W); px(6, 12, 4, 5, W); px(11, 12, 4, 5, W);       // 甲顶缘三根白刺（唯一白色排）
  px(2, 22, 3, 3, Y); px(7, 26, 3, 3, Y);             // 甲纹
  px(10, 6, 7, 12, R);                                // 红鬃毛：头与甲之间的色块分隔
  px(14, 22, 9, 15, T); px(15, 27, 7, 2, Y); px(15, 32, 7, 2, Y);    // 胸甲（米色 + 两道纹）
  px(3, 37, 8, 9 - step * 2, G); px(1, 44 - step * 2, 12, 4, '#000000');   // 后腿 + 黑脚掌
  px(16, 37, 9, 7 + step * 2, G); px(14, 42 + step * 2, 13, 4, '#000000'); // 前腿 + 黑脚掌
  px(2, 44 - step * 2, 2, 3, W); px(9, 44 - step * 2, 2, 3, W);      // 后爪
  px(15, 42 + step * 2, 2, 3, W); px(23, 42 + step * 2, 2, 3, W);    // 前爪
  px(21, 25 + step * 2, 9, 5, G); px(28, 26 + step * 2, 3, 4, W);    // 前臂 + 爪
  px(14, 2, 18, 18, G);                               // 头（前移且更大）
  px(16, -3, 4, 6, W); px(23, -3, 4, 6, W);           // 双角（只在头顶）
  px(24, 11, 8, 8, T); px(24, 16, 8, 3, M);           // 口鼻 + 口腔
  px(25, 15, 2, 2, W); px(29, 15, 2, 2, W);           // 獠牙
  px(19, 6, 6, 5, W); px(22, 7, 3, 3, '#000000');     // 白眼 + 黑瞳
  if (b.state === 'breatheFire') px(30, 15, 6, 5, O); // 喷火：口腔火光（长条火焰由 drawBossFlame 接续）
  if (b.stunT > 0 && !dead) {                         // 眩晕：眼睛打叉
    rect(ctx, 19, 8, 6, 1, '#000000'); rect(ctx, 21, 5, 1, 7, '#000000');
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}
/** 直线火焰：从嘴部向外逐段变窄的双层火舌（外橙内黄 + 高低抖动），按 Boss 朝向定宽端 */
function drawBossFlame(b) {
  const f = b.flame, seg = 10, sw = f.w / seg;
  const ph = Math.floor(gameTime * 16) % 2 ? 1 : -1;
  const cy = f.y + f.h / 2, x0 = Math.round(f.x - camX);
  for (let i = 0; i < seg; i++) {
    const t = i / (seg - 1);                           // 0=嘴部（最粗）→ 1=末端（最细）
    const h = Math.max(4, f.h * (1 - t * 0.7) + ph * (i % 2 ? 2 : -2) * (1 - t));
    const sx = b.facing > 0 ? x0 + i * sw : x0 + f.w - (i + 1) * sw;
    rect(ctx, Math.round(sx), Math.round(cy - h / 2), Math.ceil(sw) + 1, Math.round(h), '#ff8000');
    rect(ctx, Math.round(sx), Math.round(cy - h / 4), Math.ceil(sw) + 1, Math.max(2, Math.round(h / 2)), '#ffd23f');
  }
}
function drawHammer(h) {
  const sx = Math.round(h.x - camX + h.w / 2), sy = Math.round(h.y + h.h / 2);
  ctx.save(); ctx.translate(sx, sy); ctx.rotate(h.rot);
  rect(ctx, -3, 0, 6, 13, '#8a5a20'); rect(ctx, -1, 1, 2, 11, '#c08a40');    // 木柄
  rect(ctx, -8, -10, 16, 10, '#b8c0c8'); rect(ctx, -8, -10, 16, 3, '#e8f0f8');  // 锤头
  rect(ctx, -8, -10, 16, 1, '#000000'); rect(ctx, -8, 0, 16, 1, '#000000');
  ctx.restore();
}
/** Boss 房世界层绘制：掉落金币 + 库巴（画在角色之前） */
function drawBossRoom() {
  const B = bossRoom;
  if (!B.active) return;
  for (const d of B.drops) {
    const sx = Math.round(d.x - camX), sy = Math.round(d.y);
    if (sx < -32 || sx > VIEW_W + 32) continue;
    ctx.drawImage(coinFrames[Math.floor(coinT * 8) % 3], sx, sy, d.w, d.h);
  }
  if (B.boss) drawBowser(B.boss);
}
/** Boss 房特效层绘制：锤子 + 火焰（画在角色之后） */
function drawBossRoomFx() {
  const B = bossRoom;
  if (!B.active) return;
  for (const h of B.hammers) drawHammer(h);
  if (B.boss && B.boss.flame) drawBossFlame(B.boss);
}
/** 入口横管（左侧，管口朝右）：入房落点，也是按 ↓ 主动退出的位置 */

}
/** 挑战房 HUD：倒计时 + 实时"同时亮"数 + 最快熄灭倒计时（谜题关键反馈）+ 房内提示 */
function drawChallengeHUD() {
  const C = challengeRoom;
  if (!C.active) return;
  ctx.textAlign = 'center';
  const sec = Math.max(0, Math.ceil(C.time));
  const danger = !C.gateOpen && sec <= 5 && Math.floor(coinT * 4) % 2 === 0;
  shadowText('挑战 ' + sec + 's', VIEW_W / 2, 44, 20, C.gateOpen ? '#7ae048' : (danger ? '#ff5a5a' : '#ffd23f'));
  const on = crLitCount();
  shadowText('同时亮 ' + on + ' / 3' + (C.gateOpen ? ' · 金库已开' : (C.failed ? ' · 已超时' : '')), VIEW_W / 2, 64, 14, C.gateOpen ? '#7ae048' : '#cfe3ff');
  /* 熄灭倒计时：取当前亮着机关里最快熄灭的那个，逼玩家判断"还来不来得及点下一座" */
  if (!C.gateOpen && on > 0) {
    const now = CR_TIME - C.time;
    let minLeft = Infinity;
    for (const k in C.switches) minLeft = Math.min(minLeft, CR_SWITCH_LIT_T - (now - C.switches[k]));
    const w = 120, bx = VIEW_W / 2 - w / 2;
    rect(ctx, bx, 70, w, 6, 'rgba(10,10,26,.55)');
    rect(ctx, bx, 70, Math.max(0, w * minLeft / CR_SWITCH_LIT_T), 6, minLeft < 2.5 ? '#ff5a5a' : '#7ae048');
    shadowText('熄灭 ' + minLeft.toFixed(1) + 's', VIEW_W / 2, 92, 12, minLeft < 2.5 ? '#ff5a5a' : '#9ff0a8');
  }
  if (C.msgT > 0) shadowText(C.msg, VIEW_W / 2, 112, 14, '#ffffff');
  ctx.textAlign = 'left';
}
/** 房内 HUD：房内金币（与全局金币分列两个口径）、能力图标、商店价格、Boss 血条、提示文字 */
function drawBossRoomHUD() {
  const B = bossRoom;
  ctx.textAlign = 'left';
  if (B.active) {
    /* 房内余额：顶部第二行居中，左侧带金币图标，避免与左上角全局金币读成同一口径 */
