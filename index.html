<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>像素马里奥 · Canvas 2D 平台跳跃</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#141428;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Microsoft YaHei",monospace;touch-action:none;}
  /* 画面尺寸：宽/高双向约束（横屏不再被裁切）；触屏下按 --ctlH 让出控件带，按钮永不压住画面 */
  canvas{aspect-ratio:960/544;width:min(96vw, calc((100vh - var(--ctlH,0px) - 64px) * 1.7647), 960px);
    height:auto;margin-bottom:var(--ctlH,0px);image-rendering:pixelated;border:4px solid #000;border-radius:4px;
    box-shadow:0 10px 40px rgba(0,0,0,.6);background:#5c94fc;}
  @supports (height:100dvh){ canvas{ width:min(96vw, calc((100dvh - var(--ctlH,0px) - 64px) * 1.7647), 960px);} }
  body.coarse{--ctlH:calc(180px + env(safe-area-inset-bottom, 0px));}
  body.lay-x{--ctlH:0px;}                    /* 横屏与强制横屏共用：按键落进画面左右侧带，不再占纵向空间 */
  /* ---- 强制横屏：#stage 旋转 -90°，画面顶 = 设备左边 → 玩家顺时针转手机即可读（与引导图标 ↻ 同向）。
         不依赖设备愿意转屏或 orientation.lock 是否可用。
         轴向互换后 vw/vh 与画面局部轴不再对应，故画布 CSS 尺寸由 fitStage() 按 #stage 实际盒子算。
         安全区同步换轴：画面左=设备底（Home 条边）、画面上=设备左、画面右=设备顶（多数机型刘海边）→ 系统键避开刘海。 */
  #stage{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  body.force-rot #stage{position:fixed;left:0;top:100vh;width:100vh;height:100vw;transform:rotate(-90deg);transform-origin:0 0;}
  @supports (height:100dvh){ body.force-rot #stage{width:100dvh;height:100dvw;} }
  body.force-rot #touch{position:absolute;}  /* fixed 后代在 transform 容器内以 stage 为包含块，这里显式写平 */
  body.force-rot #rotate{display:none !important;}   /* 画面已横向铺满，无需拦路提示转屏 */
  .tip{color:#9fb4d0;margin-top:12px;font-size:13px;letter-spacing:1px;user-select:none;text-align:center;}
  .tip .tch{display:none;}
  body.coarse .tip .kbd{display:none;} body.coarse .tip .tch{display:inline;}
  /* 触屏虚拟按键（仅触屏设备显示，热区 ≥44px；底部避开刘海安全区）。
     视觉统一：方向键=箭头符号 / 动作键=单字汉字 / 系统键=符号，三组各自语义一致；深色底 + 白描边保证亮暗画面均可读 */
  #touch{position:fixed;inset:0;pointer-events:none;display:none;z-index:9;}
  .tbtn{position:absolute;box-sizing:border-box;pointer-events:auto;width:60px;height:60px;border-radius:14px;background:rgba(8,12,30,.42);border:2px solid rgba(255,255,255,.55);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent;transition:transform .06s ease,background .06s ease,border-color .06s ease;box-shadow:0 3px 8px rgba(0,0,0,.4);}
  /* 按压态：缩放 + 加深 + 白描边（.on 由 JS 置位，滑移换键时视觉同步；无震动的设备靠它补手感） */
  .tbtn:active,.tbtn.on{transform:scale(.92);background:rgba(8,12,30,.62);border-color:#ffffff;box-shadow:inset 0 0 0 2px rgba(0,0,0,.4),0 3px 8px rgba(0,0,0,.4);}
  /* 竖屏：下排 [◀▼▶] 方向区 + [跑][跳] A/B 并排；上排 火 + 系统工具行（键体加大到 64~84px，相邻键 ≥8px 防误触） */
  #btnL{left:10px;bottom:calc(24px + env(safe-area-inset-bottom, 0px));width:64px;height:64px;}
  #btnD{left:82px;bottom:calc(24px + env(safe-area-inset-bottom, 0px));width:64px;height:64px;}
  #btnR{left:154px;bottom:calc(24px + env(safe-area-inset-bottom, 0px));width:64px;height:64px;}
  #btnJ{right:10px;bottom:calc(24px + env(safe-area-inset-bottom, 0px));width:84px;height:84px;font-size:28px;}
  #btnB{right:102px;bottom:calc(24px + env(safe-area-inset-bottom, 0px));width:64px;height:64px;}
  #btnF{right:10px;bottom:calc(116px + env(safe-area-inset-bottom, 0px));width:64px;height:64px;}
  #btnP{left:10px;bottom:calc(116px + env(safe-area-inset-bottom, 0px));width:44px;height:44px;font-size:16px;}
  #btnX{left:62px;bottom:calc(116px + env(safe-area-inset-bottom, 0px));width:44px;height:44px;font-size:16px;}
  /* 手柄式横屏按键：左带 = 方向（◀▶ 并排 + ▼ 居中其上）+ 左上肩位「跑」；右带 = 「跳」为主、「火」竖排其上，系统键右上。
     「跑」放肩位的理由：冲刺跳要同时占住「跑」与「跳」，若两键都在右拇指行程内则结构上无法完成；
     移交给左手食指后变成两个单手动作（左=跑+方向，右=跳），也不再需要滑移并存。
     底行不叠加 safe-area-inset-bottom：真横屏下它只是圆角余量，强制横屏下该边已换轴映射到画面左侧。
     已知取舍：视口极矮时（画布竖向几乎顶满）右上 44px 系统键会擦到画布顶角，与改造前的真横屏行为一致，不为它再砍画布。 */
  body.lay-x{--saL:env(safe-area-inset-left, 0px);--saR:env(safe-area-inset-right, 0px);--saT:env(safe-area-inset-top, 0px);}
  body.force-rot{--saL:env(safe-area-inset-bottom, 0px);--saR:env(safe-area-inset-top, 0px);--saT:env(safe-area-inset-left, 0px);}
  body.lay-x #btnL{left:calc(2px + var(--saL));bottom:10px;width:64px;height:64px;}
  body.lay-x #btnR{left:calc(76px + var(--saL));bottom:10px;width:64px;height:64px;}          /* 与 ◀ 留 10px 缝 */
  body.lay-x #btnD{left:calc(44px + var(--saL));bottom:86px;width:56px;height:56px;font-size:21px;}   /* 与方向行留 12px，不再压在 ◀▶ 缝上 */
  body.lay-x #btnB{left:calc(2px + var(--saL));top:calc(8px + var(--saT));width:68px;height:50px;font-size:20px;}
  body.lay-x #btnJ{right:calc(2px + var(--saR));bottom:10px;width:88px;height:88px;font-size:28px;}
  body.lay-x #btnF{right:calc(10px + var(--saR));bottom:106px;width:64px;height:64px;font-size:22px;}   /* 竖排在跳键上方：右带最深只到 90px，把画面宽度还给画布 */
  body.lay-x #btnP{left:auto;right:calc(2px + var(--saR));bottom:auto;top:calc(8px + var(--saT));width:48px;height:48px;font-size:17px;}
  body.lay-x #btnX{left:auto;right:calc(58px + var(--saR));bottom:auto;top:calc(8px + var(--saT));width:48px;height:48px;font-size:17px;}
  /* 横屏引导遮罩（兜底）：仅当连 CSS 旋转都不可用时才显示；正常触屏竖屏已被 force-rot 直接转成横向，不再拦路 */
  #rotate{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;background:rgba(10,10,25,.92);color:#fff;font-family:"Microsoft YaHei",monospace;text-align:center;}
  #rotate.show{display:flex;}
  .rphone{width:64px;height:112px;border:4px solid #9fb4d0;border-radius:12px;position:relative;animation:rturn 1.8s ease-in-out infinite;}
  .rphone::after{content:"";position:absolute;left:50%;bottom:6px;width:16px;height:3px;border-radius:2px;background:#9fb4d0;transform:translateX(-50%);}
  .rarrow{position:absolute;right:-34px;top:-6px;font-size:34px;color:#ffd23f;}
  @keyframes rturn{0%,20%{transform:rotate(0)}60%,80%{transform:rotate(90deg)}100%{transform:rotate(90deg)}}
  .rtxt{font-size:22px;letter-spacing:4px;}
  #rotate button{padding:14px 40px;font-size:18px;border-radius:10px;border:2px solid #ffd23f;background:rgba(255,210,63,.15);color:#ffd23f;font-family:inherit;}
  #rotate button.rskip{border-color:#5a6a85;background:transparent;color:#9fb4d0;font-size:15px;padding:10px 28px;}
/* ===================== 玩法说明模态窗 ===================== */
#manualBtn{position:fixed;right:14px;top:14px;z-index:8;width:46px;height:46px;border-radius:12px;
  background:rgba(8,12,30,.55);border:2px solid #ffd23f;color:#ffd23f;font-size:22px;font-weight:bold;
  font-family:inherit;display:none;align-items:center;justify-content:center;cursor:pointer;
  user-select:none;-webkit-user-select:none;box-shadow:0 3px 8px rgba(0,0,0,.4);line-height:1;
  -webkit-tap-highlight-color:transparent;transition:transform .06s ease;}
#manualBtn:active{transform:scale(.92);}
body.force-rot #manualBtn{right:auto;left:calc(2px + env(safe-area-inset-bottom,0px));top:calc(8px + env(safe-area-inset-left,0px));}
#manual-overlay{position:fixed;inset:0;z-index:18;display:none;align-items:center;justify-content:center;
  background:rgba(6,6,20,.78);}
#manual{position:relative;width:min(820px,94vw);max-height:88vh;overflow:hidden;display:flex;flex-direction:column;
  background:#1c1c3a;border:4px solid #000;box-shadow:inset 0 0 0 2px #3a3a5e,0 12px 40px rgba(0,0,0,.6);
  border-radius:6px;color:#f5f6fa;font-family:"SimSun","NSimSun","Microsoft YaHei",monospace;}
#manual-close{position:absolute;right:10px;top:8px;width:34px;height:34px;border-radius:8px;
  background:rgba(255,90,90,.15);border:2px solid #ff5a5a;color:#ff5a5a;font-size:20px;cursor:pointer;
  font-family:inherit;z-index:2;line-height:1;}
#manual-body{padding:22px 26px 10px;overflow-y:auto;flex:1;letter-spacing:1px;line-height:1.8;font-size:14px;
  -webkit-overflow-scrolling:touch;}
#manual-body::-webkit-scrollbar{width:10px;}
#manual-body::-webkit-scrollbar-thumb{background:#3a3a5e;border-radius:5px;}
#manual-body h2{font-size:18px;color:#fff;letter-spacing:3px;margin:0 0 14px;padding-bottom:8px;
  border-bottom:3px dashed #3a3a5e;}
#manual-body h2 .tag{display:inline-block;background:#ffd23f;color:#000;padding:0 8px;margin-right:10px;
  box-shadow:2px 2px 0 #000;font-size:14px;}
#manual-body h2 .c{color:#ffd23f;}
#manual-body .boss{border:2px solid #8a2b2b;box-shadow:inset 0 0 0 2px #5a1a1a;background:#241828;
  padding:14px 16px;margin:10px 0;border-radius:6px;}
#manual-body .boss h2 .tag{background:#ff5a5a;color:#fff;}
#manual-body p{margin-bottom:8px;}
#manual-body .dim{color:#9fb4d0;}
#manual-body .hl{color:#ffd23f;}
#manual-body .rd{color:#ff5a5a;font-weight:bold;}
#manual-body .gn{color:#7ae048;font-weight:bold;}
#manual-body .cn{color:#5ad0ff;font-weight:bold;}
#manual-body table{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0;}
#manual-body th,#manual-body td{border:2px solid #000;padding:6px 8px;text-align:left;vertical-align:top;}
#manual-body th{background:#c87137;color:#fff;letter-spacing:1px;}
#manual-body tr:nth-child(even) td{background:#23234a;}
#manual-body tr:nth-child(odd) td{background:#1a1a38;}
#manual-body td.k{color:#ffd23f;white-space:nowrap;font-weight:bold;}
#manual-body kbd{display:inline-block;background:#000;color:#fff;border:2px solid #fff;
  box-shadow:2px 2px 0 #5a5a8a;padding:0 6px;margin:0 2px;font-size:12px;font-family:inherit;white-space:nowrap;}
#manual-body ul{list-style:none;padding-left:2px;}
#manual-body ul li{padding-left:20px;position:relative;margin-bottom:6px;}
#manual-body ul li::before{content:"◆";position:absolute;left:0;color:#ffd23f;font-size:11px;top:5px;}
#manual-body .lv{display:inline-block;background:#5c94fc;color:#000;font-weight:bold;padding:0 8px;
  box-shadow:2px 2px 0 #000;margin-right:8px;}
#manual-nav{display:flex;align-items:center;justify-content:space-between;padding:10px 22px 16px;
  border-top:2px solid #3a3a5e;background:#161630;}
#manual-nav button{background:rgba(8,12,30,.5);border:2px solid #9fb4d0;color:#fff;padding:8px 16px;
  border-radius:8px;font-family:inherit;font-size:14px;cursor:pointer;letter-spacing:1px;}
#manual-nav button:active{transform:scale(.94);}
#manual-pager{color:#ffd23f;font-size:14px;letter-spacing:2px;font-weight:bold;}
</style>
</head>
<body>
<div id="stage">
<canvas id="game" width="960" height="544"></canvas>
<div class="tip"><span class="kbd">A / D 移动 ｜ Shift 奔跑 ｜ 空格 / W 跳跃 ｜ S / ↓ 蹲下・入管 ｜ J / X 火球 ｜ M 音效 ｜ P 暂停 ｜ R 重开</span><span class="tch">画面已强制横屏：左手 ◀▶ ＋ 食指「跑」 ・ 右手 「跳」「火」</span></div>
<div id="touch">
  <div class="tbtn" id="btnL">◀</div>
  <div class="tbtn" id="btnR">▶</div>
  <div class="tbtn" id="btnJ">跳</div>
  <div class="tbtn" id="btnF">火</div>
  <div class="tbtn" id="btnB">跑</div>
  <div class="tbtn" id="btnD">▼</div>
  <div class="tbtn" id="btnP">Ⅱ</div>
  <div class="tbtn" id="btnX">⛶</div>
</div>
</div>
<button id="manualBtn" title="玩法说明 (H)">?</button>
<div id="manual-overlay">
  <div id="manual">
    <button id="manual-close">×</button>
    <div id="manual-body"></div>
    <div id="manual-nav">
      <button id="manual-prev">◀ 上一页</button>
      <span id="manual-pager">1 / 8</span>
      <button id="manual-next">下一页 ▶</button>
    </div>
  </div>
</div>
<!-- 横屏引导遮罩：仅当无法自动横向（极少数环境 CSS 旋转也失效）时兜底显示，点按钮尝试全屏+锁定横屏 -->
<div id="rotate">
  <div class="rphone"><div class="rarrow">↻</div></div>
  <div class="rtxt">请横屏游戏</div>
  <button id="btnGo">横屏开始</button>
  <button id="btnSkip" class="rskip">继续竖屏</button>
</div>
<script>
'use strict';
/* =====================================================================
 * 《像素马里奥》单文件 2D 平台跳跃游戏 —— 引擎基线 + 核心玩法系统
 * 纯 HTML + Canvas 2D + 原生 JS，零依赖、无 CDN。
 * 分区目录（Ctrl+F 搜 “======” 定位）：
 *   1. 常量与配置        2. 瓦片地图系统       3. 输入
 *   4. 物理与 AABB 碰撞  5. 道具/敌人/火球     6. 状态机与特效
 *   6.5 资源管理 Boss 奖励房                    7. 音效（WebAudio 振荡器 8-bit 占位）  8. 摄像机
 *   9. 像素渲染          10. 主循环（固定时间步） 11. 调试/自动化钩子
 * 引擎段（1~4、8、10 的既有函数）保持基线原样，玩法以扩展/新增方式挂入。
 * ===================================================================== */

/* ============================ 1. 常量与配置 ============================ */
const TILE      = 32;                 // 瓦片边长（px），即 tileSize
const tileSize  = TILE;                // 规格要求的别名常量
const VIEW_W    = 960, VIEW_H = 544;  // 画布逻辑尺寸（30 列 × 17 行）

/* ---- 物理量纲全部为“每秒制”（px/s、px/s²） ---- */
const GRAVITY    = 2400;              // 重力加速度
const JUMP_V     = 784;               // 起跳初速度（向上）：静止最大跳约 4 格（原版 SMB）
const JUMP_CUT   = 0.45;              // 松开跳键时上升速度截断比例（可变跳跃高度）
/* 触屏最小持按：到顶要 784/2400≈0.33s，而手指"点"通常只有 60~120ms —— 不保底的话移动端几乎每次都是
   截断跳（实测 83ms 松手只有 2.1 格）。取 0.15s：点按保底实测 2.7 格（稳过 2 格水管），长按仍可 3.8 格，
   保留约 1 格的可变高度余量。键盘不启用（长按是主动意图，短跳工具要留着）。 */
const JUMP_HOLD_MIN = 0.15;
const MAX_FALL   = 1100;              // 最大下落速度上限
const MOVE_ACCEL = 2400;              // 地面行走加速度
const AIR_ACCEL  = 1700;              // 空中操控加速度
const FRICTION   = 2800;              // 地面摩擦力（无输入时减速到 0）
const MAX_SPEED  = 330;               // 水平最大速度（基准值，供音效归一化）
const WALK_MAX   = 250;               // 步行最高速度（原版 walk 档）
const RUN_MAX    = 440;               // B 键奔跑最高速度（原版 run 档）
const SKID_V     = 170;               // 反向打滑触发的最低速度
const COYOTE     = 0.08;              // 土狼时间：离开平台后仍可起跳的宽限
const JUMP_BUFFER= 0.12;              // 跳跃预输入缓冲
const STEP       = 1 / 120;           // 物理固定时间步
const BUMP_T     = 0.2;               // 砖块被顶后的弹跳动画时长
const PLAYER_W   = 24, PLAYER_H = 30; // 小形态 AABB（1×1 格）
const STUCK_T    = 0.8;               // 嵌进实心瓦片超时 → 自动复位（防卡死）

/* ---- 玩法常量 ---- */
const BIG_W    = 24, BIG_H = 52;      // 大/火力形态 AABB（1×2 格）
const INVULN_T = 2.0;                 // 变身/受击后的无敌帧时长
const STOMP_BOUNCE      = 460;        // 踩敌反弹速度
const STOMP_BOUNCE_HELD = 700;        // 按住跳键时踩敌反弹速度
const GOOMBA_SPEED = 72;              // 板栗仔移速（较原版上调：增加迎面压迫感，仍远低于步速 250）
const KOOPA_SPEED  = 86;              // 乌龟移速
const PARA_HOP_V   = 560;             // 跳跃乌龟起跳速度（原版 1-3 红跳跳龟：落地即弹起）
const SHELL_SPEED  = 460;             // 龟壳被踢飞速度
const ITEM_SPEED   = 90;              // 蘑菇滑行速度
const FIREBALL_SPEED = 460, FIREBALL_MAX = 2, FIREBALL_LIFE = 2.2;
const POLE_SLIDE_V = 260;             // 抓旗杆下滑速度
const START_LIVES  = 3;
/* ---- 计分（规格：金币+200 / 踩敌+100 / 顶砖+50） ---- */
const PTS_COIN = 200, PTS_STOMP = 100, PTS_BRICK = 50, PTS_POWER = 1000,
      PTS_SHELL_KILL = 400, PTS_FIRE_KILL = 200;
/* 关卡可变量：由 loadLevel() 从当前 LEVELS 项写入（原为 const，多关卡后改为可变） */
let LEVEL_NAME = 'World 1-1';
let GOAL_COL   = 198;             // 终点旗杆所在列（当前关卡）
/* ---- 无敌星 / 倒计时（原版 1-1 机制） ---- */
const STAR_TIME   = 9;              // 无敌星持续时间（秒）
const STAR_SPEED  = 120;            // 星星滑行速度
const STAR_BOUNCE = 380;            // 星星落地弹跳初速
let TIME_LIMIT  = 400;              // 关卡倒计时（当前关卡；原版 1-1 = 400）：归零死亡，剩余时间过关加分
/* ---- 食人花（Piranha Plant）：固定种在指定水管管口，四阶段伸缩周期 ---- */
const PLANT_SPR_W = 32, PLANT_SPR_H = 64;   // 精灵尺寸（16×32 字符画 @2px）
const PLANT_HIT_W = 26;                     // 伤害判定盒宽（略窄于精灵，对玩家公平）
const PLANT_RISE  = 2 * TILE;               // 最大伸出高度：管口向上 2 格

/** 生成二维瓦片数组 map[row][col]（按当前关卡 cur 展开） */
function buildMap() {
  const m = Array.from({ length: MAP_H }, () => new Array(MAP_W).fill(T_EMPTY));
  const set = (x, y, t) => { if (x >= 0 && x < MAP_W && y >= 0 && y < MAP_H) m[y][x] = t; };
  for (let x = 0; x < MAP_W; x++) { set(x, GROUND_ROW, T_GROUND); set(x, GROUND_ROW + 1, T_GROUND); }
  for (const [a, b] of cur.pits) for (let x = a; x <= b; x++) { set(x, GROUND_ROW, T_EMPTY); set(x, GROUND_ROW + 1, T_EMPTY); }
  for (const p of cur.pipes) {
    if (p.top) { const r0 = p.row !== undefined ? p.row : 2;      // 吊管：自 row 向下挂 h 格（管口朝下）
      for (let x = p.col; x <= p.col + 1; x++) for (let k = 0; k < p.h; k++) set(x, r0 + k, T_PIPE);
    } else for (let x = p.col; x <= p.col + 1; x++) for (let k = 0; k < p.h; k++) set(x, GROUND_ROW - 1 - k, T_PIPE);
  }
  for (const [x, y] of cur.bricks)  set(x, y, T_BRICK);
  for (const [x, y] of cur.qblocks) set(x, y, T_QBLOCK);
  for (const [x, y] of cur.coins)   set(x, y, T_COIN);
  for (const [x, h] of cur.stairs)  for (let k = 0; k < h; k++) set(x, GROUND_ROW - 1 - k, T_GROUND);
  for (const [x, y] of cur.hidden) set(x, y, T_HIDDEN);
  return m;
}

function buildUnderMap(W) {

  for (let x = 0; x < W; x++) { m[0][x] = T_BRICK; m[1][x] = T_BRICK; m[15][x] = T_GROUND; m[16][x] = T_GROUND; }
  for (let y = 0; y < 15; y++) { m[y][0] = T_GROUND; m[y][R] = T_GROUND; }   // 左右墙
  const c0 = Math.round(W * 0.23), c1 = Math.round(W * 0.73);
  for (let x = c0; x <= c1; x++) m[14][x] = T_COIN;                            // 地面金币带
  for (let x = c0 + 2; x <= c1 - 2; x++) if ((x - c0) % 4 !== 3) m[13][x] = T_COIN;   // 上层堆叠
  m[12][c0 + 3] = T_COIN; m[12][c1 - 3] = T_COIN;
  return m;
}
